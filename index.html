{ id:"j6", title:"Textos a fundo", summary:"Métodos de String, caracteres, StringBuilder e formatação.",
items:[
{ kind:"lesson", id:"metodos-texto", title:"Ferramentas de String", eyebrow:"trim, split, replace…",
  body:`<p>Alguns métodos de String muito usados: <code>trim()</code> tira os espaços das pontas, <code>split(" ")</code> separa em um array de partes, <code>replace(a, b)</code> troca trechos, <code>substring(i, f)</code> recorta, <code>indexOf</code> procura, <code>startsWith</code> e <code>contains</code> conferem.</p>
<p>Strings nunca mudam: cada método devolve uma String <strong>nova</strong>, que você precisa guardar. Para separar por qualquer quantidade de espaços, use <code>split("\\\\s+")</code>.</p>`,
  examples:[P(`String texto = "  aprender java é divertido  ";
System.out.println("[" + texto.trim() + "]");
System.out.println(texto.replace("divertido", "útil"));
String[] palavras = texto.trim().split("\\\\s+");
System.out.println(palavras.length + " palavras, a primeira é " + palavras[0]);
String nome = "maria";
System.out.println(nome.substring(0, 1).toUpperCase() + nome.substring(1));`)],
  task:`Crie <code>static String capitalizar(String palavra)</code>, que devolve a palavra com a primeira letra maiúscula e o resto minúsculo, e <code>static int contarPalavras(String frase)</code>, que conta as palavras ignorando espaços extras.`,
  starter:P(`System.out.println(capitalizar("jAVA"));
System.out.println(contarPalavras("  o rato roeu a roupa "));`, { methods:`` }),
  hint:`capitalizar: palavra.substring(0, 1).toUpperCase() + palavra.substring(1).toLowerCase(). contarPalavras: frase.trim().split("\\\\s+").length`,
  solution:P(`System.out.println(capitalizar("jAVA"));
System.out.println(contarPalavras("  o rato roeu a roupa "));`, { methods:`static String capitalizar(String palavra) {
    return palavra.substring(0, 1).toUpperCase() + palavra.substring(1).toLowerCase();
}

static int contarPalavras(String frase) {
    return frase.trim().split("\\\\s+").length;
}` }),
  tests:[{call:`System.out.println(capitalizar("jAVA"));
System.out.println(capitalizar("maria"));
System.out.println(contarPalavras("  o rato roeu a roupa "));
System.out.println(contarPalavras("java"));`, expect:`Java
Maria
5
1`}] },

{ kind:"lesson", id:"char", title:"Caracteres", eyebrow:"char e charAt",
  body:`<p>Um <code>char</code> é um único caractere, entre aspas simples: <code>'a'</code>. <code>texto.charAt(i)</code> devolve o caractere da posição <code>i</code>, e a classe <code>Character</code> tem testes prontos como <code>Character.isDigit(c)</code>, <code>isLetter</code> e <code>isUpperCase</code>.</p>
<p>Por dentro, cada char é um número (o código dele). Por isso <code>'a' + 1</code> dá <code>98</code>; para voltar a ser letra, use <code>(char)</code>.</p>`,
  examples:[P(`String senha = "abc123";
int digitos = 0;
for (int i = 0; i < senha.length(); i++) {
    char c = senha.charAt(i);
    if (Character.isDigit(c)) {
        digitos++;
    }
}
System.out.println(digitos + " dígitos");
System.out.println('a' + 1);
System.out.println((char) ('a' + 1));`)],
  task:`Crie <code>static String esconder(String telefone)</code> que troca todos os dígitos por <code>*</code>, menos os 4 últimos. Exemplo: <code>"11987654321"</code> vira <code>*******4321</code>.`,
  starter:P(`System.out.println(esconder("11987654321"));`, { methods:`` }),
  hint:`"*".repeat(telefone.length() - 4) + telefone.substring(telefone.length() - 4)`,
  solution:P(`System.out.println(esconder("11987654321"));`, { methods:`static String esconder(String telefone) {
    int n = telefone.length();
    return "*".repeat(n - 4) + telefone.substring(n - 4);
}` }),
  tests:[{call:`System.out.println(esconder("11987654321"));
System.out.println(esconder("1234"));
System.out.println(esconder("5551234"));`, expect:`*******4321
1234
***1234`}] },

{ kind:"lesson", id:"stringbuilder", title:"Montando textos", eyebrow:"StringBuilder",
  body:`<p>Juntar Strings com <code>+</code> dentro de um laço cria uma String nova a cada volta, o que fica lento em textos grandes. O <code>StringBuilder</code> monta o texto aos poucos: <code>append</code> acrescenta, <code>reverse</code> inverte e <code>toString</code> devolve a String pronta.</p>`,
  examples:[P(`StringBuilder sb = new StringBuilder();
for (int i = 1; i <= 5; i++) {
    sb.append(i);
    if (i < 5) {
        sb.append(", ");
    }
}
System.out.println(sb.toString());
System.out.println(new StringBuilder("roma").reverse());`)],
  task:`Crie <code>static String repetir(String texto, int vezes, String separador)</code> usando StringBuilder. Exemplo: <code>repetir("ha", 3, "-")</code> devolve <code>ha-ha-ha</code>.`,
  starter:P(`System.out.println(repetir("ha", 3, "-"));`, { methods:`` }),
  hint:`Num for de 0 até vezes: append do texto e, se não for a última volta, append do separador.`,
  solution:P(`System.out.println(repetir("ha", 3, "-"));`, { methods:`static String repetir(String texto, int vezes, String separador) {
    StringBuilder sb = new StringBuilder();
    for (int i = 0; i < vezes; i++) {
        sb.append(texto);
        if (i < vezes - 1) {
            sb.append(separador);
        }
    }
    return sb.toString();
}` }),
  require:[{re:/StringBuilder/, msg:"Use um StringBuilder."}],
  tests:[{call:`System.out.println(repetir("ha", 3, "-"));
System.out.println(repetir("Java", 1, ", "));
System.out.println(repetir("ab", 4, ""));`, expect:`ha-ha-ha
Java
abababab`}] },

{ kind:"lesson", id:"formatacao", title:"Formatando números", eyebrow:"printf e String.format",
  body:`<p><code>System.out.printf</code> mostra um texto com "buracos" preenchidos por valores: <code>%d</code> para inteiros, <code>%.2f</code> para decimais com 2 casas, <code>%s</code> para textos e <code>%n</code> para pular linha. <code>String.format</code> faz o mesmo, mas devolve a String em vez de mostrar.</p>
<p>Também dá para controlar a largura: <code>%5d</code> ocupa 5 espaços, <code>%-10s</code> alinha à esquerda em 10.</p>`,
  examples:[P(`String produto = "Café";
double preco = 12.5;
int qtd = 3;
System.out.printf("%s: %d x R$ %.2f = R$ %.2f%n", produto, qtd, preco, preco * qtd);
String linha = String.format("%-10s|%8.2f", produto, preco);
System.out.println(linha);
System.out.printf("%.1f%%%n", 45.678);`)],
  task:`Crie <code>static String precoBr(double valor)</code> que devolve o preço no formato brasileiro, com R$ e duas casas separadas por vírgula. Exemplo: <code>precoBr(12.5)</code> devolve <code>R$ 12,50</code>.`,
  starter:P(`System.out.println(precoBr(12.5));`, { methods:`` }),
  hint:`String.format("R$ %.2f", valor).replace('.', ',')`,
  solution:P(`System.out.println(precoBr(12.5));`, { methods:`static String precoBr(double valor) {
    return String.format("R$ %.2f", valor).replace('.', ',');
}` }),
  tests:[{call:`System.out.println(precoBr(12.5));
System.out.println(precoBr(3));
System.out.println(precoBr(1234.567));`, expect:`R$ 12,50
R$ 3,00
R$ 1234,57`}] },

{ kind:"chal", id:"d-inverter", title:"Texto ao contrário", level:"Médio",
  task:`Crie <code>static String inverter(String texto)</code> e <code>static boolean palindromo(String texto)</code>, que diz se o texto é igual lido ao contrário, ignorando maiúsculas.`,
  tip:`<code>new StringBuilder(texto).reverse().toString()</code> inverte. Para comparar ignorando maiúsculas, existe <code>equalsIgnoreCase</code>.`,
  starter:P(`System.out.println(inverter("java"));
System.out.println(palindromo("Ana"));`, { methods:`` }),
  hint:`return texto.equalsIgnoreCase(inverter(texto));`,
  solution:P(`System.out.println(inverter("java"));
System.out.println(palindromo("Ana"));`, { methods:`static String inverter(String texto) {
    return new StringBuilder(texto).reverse().toString();
}

static boolean palindromo(String texto) {
    return texto.equalsIgnoreCase(inverter(texto));
}` }),
  tests:[{call:`System.out.println(inverter("java"));
System.out.println(inverter("roma"));
System.out.println(palindromo("arara"));
System.out.println(palindromo("Ana"));
System.out.println(palindromo("casa"));`, expect:`avaj
amor
true
true
false`}] },

{ kind:"chal", id:"d-palavras", title:"Contador de palavras", level:"Difícil",
  task:`Crie <code>static HashMap&lt;String, Integer&gt; contar(String frase)</code>, que devolve quantas vezes cada palavra aparece.`,
  tip:`Separe com <code>split(" ")</code> e use <code>getOrDefault(palavra, 0) + 1</code> para somar.`,
  starter:P(`System.out.println(contar("o gato e o rato").get("o"));`, { imports:"import java.util.HashMap;", methods:`` }),
  hint:`for (String p : frase.split(" ")) resultado.put(p, resultado.getOrDefault(p, 0) + 1);`,
  solution:P(`System.out.println(contar("o gato e o rato").get("o"));`, { imports:"import java.util.HashMap;", methods:`static HashMap<String, Integer> contar(String frase) {
    HashMap<String, Integer> resultado = new HashMap<>();
    for (String p : frase.split(" ")) {
        resultado.put(p, resultado.getOrDefault(p, 0) + 1);
    }
    return resultado;
}` }),
  tests:[{call:`HashMap<String, Integer> c = contar("o gato e o rato");
System.out.println(c.get("o"));
System.out.println(c.get("gato"));
System.out.println(c.size());`, expect:`2
1
4`}] },

{ kind:"quiz", id:"q6", title:"Revisão: textos",
  questions:[
  { q:`O que este código mostra?`, code:`String s = "java";
s.toUpperCase();
System.out.println(s);`, options:["JAVA","java","Java","Dá erro"], answer:1,
    why:`Strings não mudam. toUpperCase devolve uma nova String, que aqui não foi guardada.` },
  { q:`O que mostra "programa".substring(0, 3)?`, options:["prog","pro","rog","p"], answer:1,
    why:`substring(início, fim) vai do início até antes do fim: posições 0, 1 e 2.` },
  { q:`Quanto vale 'a' + 1?`, options:["b","a1","98","Dá erro"], answer:2,
    why:`Um char é um número por dentro ('a' é 97). Somado com int, o resultado é int.` },
  { q:`O que mostra este código?`, code:`System.out.printf("%.2f", 3.14159);`, options:["3.14159","3.14","3,14","3.1"], answer:1,
    why:`%.2f mostra o número com duas casas decimais.` },
  ]},
]},

/* ============================================================ 7 */
{ id:"j7", title:"Exceções", summary:"try/catch, validação de entrada, throw e exceções próprias.",
items:[
{ kind:"lesson", id:"try", title:"Tratando erros", eyebrow:"try e catch",
  body:`<p>Quando algo dá errado durante a execução, o Java lança uma <em>exceção</em> e o programa para. Algumas comuns: <code>NumberFormatException</code> (texto que não vira número), <code>ArithmeticException</code> (divisão de inteiro por zero), <code>ArrayIndexOutOfBoundsException</code> e <code>NullPointerException</code>.</p>
<p>Para tratar, coloque o código arriscado num <code>try</code> e diga no <code>catch</code> o que fazer se aquela exceção acontecer.</p>`,
  examples:[P(`String texto = "abc";
try {
    int numero = Integer.parseInt(texto);
    System.out.println("Deu certo: " + numero);
} catch (NumberFormatException e) {
    System.out.println("Isso não é um número: " + e.getMessage());
}
System.out.println("O programa continua normalmente");`)],
  task:`Leia uma linha. Se ela for um número inteiro, mostre o dobro dele. Se não for, mostre <code>Isso não é um número</code>.`,
  starter:P(`Scanner sc = new Scanner(System.in);
String linha = sc.nextLine();
`, { imports: SC }),
  hint:`try { int n = Integer.parseInt(linha); System.out.println(n * 2); } catch (NumberFormatException e) { ... }`,
  solution:P(`Scanner sc = new Scanner(System.in);
String linha = sc.nextLine();
try {
    int n = Integer.parseInt(linha);
    System.out.println(n * 2);
} catch (NumberFormatException e) {
    System.out.println("Isso não é um número");
}`, { imports: SC }),
  require:[{re:/\btry\b/, msg:"Use try e catch."}],
  tests:[{inputs:["5"],expect:"10"},{inputs:["abc"],expect:"Isso não é um número"},{inputs:["-7"],expect:"-14"}] },

{ kind:"lesson", id:"validar", title:"Pedindo até acertar", eyebrow:"while + try",
  body:`<p>Juntando <code>while (true)</code>, <code>try/catch</code> e <code>break</code>, o programa insiste até receber um valor válido, sem quebrar.</p>`,
  examples:[P(`Scanner sc = new Scanner(System.in);
while (true) {
    System.out.print("Digite sim ou não: ");
    String r = sc.nextLine().trim().toLowerCase();
    if (r.equals("sim") || r.equals("não")) {
        System.out.println("Você respondeu " + r);
        break;
    }
    System.out.println("Resposta inválida");
}`, { imports: SC })],
  task:`Peça a idade até a pessoa digitar um número inteiro (leia a linha inteira com <code>nextLine</code>). A cada tentativa inválida, mostre <code>Digite só números</code>. No fim, mostre <code>Idade registrada: X</code>.`,
  starter:P(`Scanner sc = new Scanner(System.in);
int idade;
while (true) {

}`, { imports: SC }),
  hint:`Dentro do while: try { idade = Integer.parseInt(sc.nextLine()); break; } catch (NumberFormatException e) { System.out.println("Digite só números"); }`,
  solution:P(`Scanner sc = new Scanner(System.in);
int idade;
while (true) {
    try {
        idade = Integer.parseInt(sc.nextLine());
        break;
    } catch (NumberFormatException e) {
        System.out.println("Digite só números");
    }
}
System.out.println("Idade registrada: " + idade);`, { imports: SC }),
  tests:[{inputs:["dez","x","30"],expect:`Digite só números
Digite só números
Idade registrada: 30`},{inputs:["42"],expect:"Idade registrada: 42"}] },

{ kind:"lesson", id:"throw", title:"Lançando exceções", eyebrow:"throw",
  body:`<p>Seus métodos também podem reclamar. Com <code>throw new IllegalArgumentException("mensagem")</code> você lança uma exceção de propósito quando recebe algo inválido. Quem chamou decide como tratar, com <code>try/catch</code>, e lê a mensagem com <code>e.getMessage()</code>.</p>`,
  examples:[P(`try {
    definirNota(15);
} catch (IllegalArgumentException e) {
    System.out.println("Problema: " + e.getMessage());
}`, { methods:`static int definirNota(int nota) {
    if (nota < 0 || nota > 10) {
        throw new IllegalArgumentException("A nota precisa estar entre 0 e 10");
    }
    return nota;
}` })],
  task:`Crie <code>static double sacar(double saldo, double valor)</code>: se o valor for maior que o saldo, lance <code>IllegalArgumentException</code> com a mensagem <code>Saldo insuficiente</code>; senão, devolva o saldo que sobra.`,
  starter:P(`System.out.println(sacar(100, 30));`, { methods:`` }),
  hint:`if (valor > saldo) throw new IllegalArgumentException("Saldo insuficiente"); return saldo - valor;`,
  solution:P(`System.out.println(sacar(100, 30));`, { methods:`static double sacar(double saldo, double valor) {
    if (valor > saldo) {
        throw new IllegalArgumentException("Saldo insuficiente");
    }
    return saldo - valor;
}` }),
  require:[{re:/\bthrow\s+new\b/, msg:"Use throw new IllegalArgumentException(...)."}],
  tests:[{call:`System.out.println(sacar(100, 30));
try {
    sacar(10, 50);
} catch (IllegalArgumentException e) {
    System.out.println(e.getMessage());
}
System.out.println(sacar(50, 50));`, expect:`70.0
Saldo insuficiente
0.0`}] },

{ kind:"lesson", id:"excecao-propria", title:"Suas próprias exceções", eyebrow:"extends Exception",
  body:`<p>Você pode criar um tipo de exceção só seu, herdando de <code>Exception</code>. Ela fica mais clara que uma exceção genérica:</p>
<pre>class EstoqueInsuficienteException extends Exception {
    public EstoqueInsuficienteException(String msg) {
        super(msg);
    }
}</pre>
<p>Exceções que herdam de <code>Exception</code> são <em>verificadas</em>: o método que pode lançá-la precisa avisar com <code>throws</code>, e quem chama é obrigado a tratar.</p>`,
  examples:[P(`try {
    retirar(3, 5);
} catch (EstoqueInsuficienteException e) {
    System.out.println("Erro: " + e.getMessage());
}`, { before:`class EstoqueInsuficienteException extends Exception {
    public EstoqueInsuficienteException(String msg) {
        super(msg);
    }
}`, methods:`static int retirar(int estoque, int qtd) throws EstoqueInsuficienteException {
    if (qtd > estoque) {
        throw new EstoqueInsuficienteException("Só há " + estoque + " unidades");
    }
    return estoque - qtd;
}` })],
  task:`Crie a classe <code>IdadeInvalidaException</code> (herdando de Exception) e o método <code>static void validarIdade(int idade) throws IdadeInvalidaException</code>, que lança a exceção com a mensagem <code>Idade inválida: X</code> quando a idade for negativa ou maior que 130.`,
  starter:P(`try {
    validarIdade(200);
} catch (IdadeInvalidaException e) {
    System.out.println(e.getMessage());
}`, { before:`// crie a classe IdadeInvalidaException aqui`, methods:`` }),
  hint:`Na classe: um construtor que recebe a mensagem e chama super(msg). No método: if (idade < 0 || idade > 130) throw new IdadeInvalidaException("Idade inválida: " + idade);`,
  solution:P(`try {
    validarIdade(200);
} catch (IdadeInvalidaException e) {
    System.out.println(e.getMessage());
}`, { before:`class IdadeInvalidaException extends Exception {
    public IdadeInvalidaException(String msg) {
        super(msg);
    }
}`, methods:`static void validarIdade(int idade) throws IdadeInvalidaException {
    if (idade < 0 || idade > 130) {
        throw new IdadeInvalidaException("Idade inválida: " + idade);
    }
}` }),
  require:[{re:/class\s+IdadeInvalidaException\s+extends\s+Exception/, msg:"Crie a classe com class IdadeInvalidaException extends Exception."}],
  tests:[{call:`for (int idade : new int[]{30, -1, 131, 0}) {
    try {
        validarIdade(idade);
        System.out.println("ok " + idade);
    } catch (IdadeInvalidaException e) {
        System.out.println(e.getMessage());
    }
}`, expect:`ok 30
Idade inválida: -1
Idade inválida: 131
ok 0`}] },

{ kind:"chal", id:"d-dividir", title:"Divisão segura", level:"Fácil",
  task:`Crie <code>static int dividirSeguro(int a, int b)</code> que devolve <code>a / b</code>. Se <code>b</code> for zero, em vez de quebrar, devolva <code>-1</code>. Use try/catch.`,
  tip:`Dividir um inteiro por zero lança <code>ArithmeticException</code>.`,
  starter:P(`System.out.println(dividirSeguro(10, 2));`, { methods:`` }),
  hint:`try { return a / b; } catch (ArithmeticException e) { return -1; }`,
  solution:P(`System.out.println(dividirSeguro(10, 2));`, { methods:`static int dividirSeguro(int a, int b) {
    try {
        return a / b;
    } catch (ArithmeticException e) {
        return -1;
    }
}` }),
  require:[{re:/\btry\b/, msg:"Use try e catch."}],
  tests:[{call:`System.out.println(dividirSeguro(10, 3));
System.out.println(dividirSeguro(1, 0));
System.out.println(dividirSeguro(9, 3));`, expect:`3
-1
3`}] },

{ kind:"quiz", id:"q7", title:"Revisão: exceções",
  questions:[
  { q:`Quando o bloco catch roda?`, options:["Sempre","Só quando o try lança a exceção indicada","Antes do try","Só quando há um finally"], answer:1,
    why:`Se o try roda sem problemas, o catch é pulado.` },
  { q:`Que exceção Integer.parseInt("abc") lança?`, options:["ArithmeticException","NullPointerException","NumberFormatException","InputMismatchException"], answer:2,
    why:`O texto não pode ser convertido em número: NumberFormatException.` },
  { q:`Para que serve o bloco finally?`, options:["Para rodar algo sempre, dando erro ou não","Para lançar exceções","Para repetir o try","Para encerrar o programa"], answer:0,
    why:`O finally roda no fim, tenha havido exceção ou não. É usado para liberar recursos.` },
  { q:`O que throws faz na declaração de um método?`, options:["Lança a exceção na hora","Avisa que o método pode lançar aquela exceção","Ignora exceções","Trata a exceção"], answer:1,
    why:`throws só declara. Quem lança de fato é o throw, dentro do método.` },
  ]},
]},

/* ============================================================ 8 */
{ id:"j8", title:"Orientação a objetos", summary:"Classes, objetos, encapsulamento, herança, polimorfismo e interfaces.",
items:[
{ kind:"lesson", id:"classes", title:"Classes e objetos", eyebrow:"Criando seus próprios tipos",
  body:`<p>Uma <em>classe</em> é um molde e um <em>objeto</em> é algo criado a partir dele, com <code>new</code>. A classe declara os <strong>atributos</strong> (os dados de cada objeto) e um <strong>construtor</strong>, método especial com o mesmo nome da classe, que roda na criação.</p>
<p>Dentro da classe, <code>this.nome</code> é o atributo do objeto, e <code>nome</code> sozinho é o parâmetro. Você pode escrever outras classes no mesmo arquivo, antes da <code>Main</code>, sem o <code>public</code>.</p>`,
  examples:[P(`Pet rex = new Pet("Rex", "cachorro");
Pet mia = new Pet("Mia", "gato");
System.out.println(rex.nome + " é um " + rex.especie);
System.out.println(mia.nome + " é um " + mia.especie);`, { before:`class Pet {
    String nome;
    String especie;

    Pet(String nome, String especie) {
        this.nome = nome;
        this.especie = especie;
    }
}` })],
  task:`Complete a classe <code>Produto</code> com os atributos <code>String nome</code> e <code>double preco</code>, e um construtor que receba os dois.`,
  starter:P(`Produto caneta = new Produto("Caneta", 2.5);
System.out.println(caneta.nome + " " + caneta.preco);`, { before:`class Produto {

}` }),
  hint:`String nome; double preco; Produto(String nome, double preco) { this.nome = nome; this.preco = preco; }`,
  solution:P(`Produto caneta = new Produto("Caneta", 2.5);
System.out.println(caneta.nome + " " + caneta.preco);`, { before:`class Produto {
    String nome;
    double preco;

    Produto(String nome, double preco) {
        this.nome = nome;
        this.preco = preco;
    }
}` }),
  tests:[{call:`Produto p = new Produto("Caneta", 2.5);
System.out.println(p.nome + " " + p.preco);
Produto q = new Produto("Caderno", 15);
System.out.println(q.nome + " " + q.preco);`, expect:`Caneta 2.5
Caderno 15.0`}] },

{ kind:"lesson", id:"metodos-obj", title:"Métodos de objetos", eyebrow:"O que um objeto sabe fazer",
  body:`<p>Além de dados, a classe tem <em>métodos de instância</em> (sem <code>static</code>), que trabalham com os atributos daquele objeto. Você os chama pelo objeto: <code>conta.depositar(100)</code>.</p>`,
  examples:[P(`Lampada luz = new Lampada();
luz.alternar();
System.out.println(luz.ligada);
luz.alternar();
System.out.println(luz.ligada);`, { before:`class Lampada {
    boolean ligada = false;

    void alternar() {
        ligada = !ligada;
    }
}` })],
  task:`Complete <code>ContaBancaria</code>: <code>depositar(double valor)</code> soma ao saldo; <code>sacar(double valor)</code> tira do saldo e devolve <code>true</code>, mas, se não houver saldo suficiente, não tira nada e devolve <code>false</code>.`,
  starter:P(`ContaBancaria c = new ContaBancaria("Ana");
c.depositar(100);
System.out.println(c.saldo);`, { before:`class ContaBancaria {
    String titular;
    double saldo;

    ContaBancaria(String titular) {
        this.titular = titular;
    }

    void depositar(double valor) {

    }

    boolean sacar(double valor) {

    }
}` }),
  hint:`depositar: saldo += valor; sacar: if (valor > saldo) return false; saldo -= valor; return true;`,
  solution:P(`ContaBancaria c = new ContaBancaria("Ana");
c.depositar(100);
System.out.println(c.saldo);`, { before:`class ContaBancaria {
    String titular;
    double saldo;

    ContaBancaria(String titular) {
        this.titular = titular;
    }

    void depositar(double valor) {
        saldo += valor;
    }

    boolean sacar(double valor) {
        if (valor > saldo) {
            return false;
        }
        saldo -= valor;
        return true;
    }
}` }),
  tests:[{call:`ContaBancaria c = new ContaBancaria("Ana");
c.depositar(100);
System.out.println(c.saldo);
System.out.println(c.sacar(30));
System.out.println(c.saldo);
System.out.println(c.sacar(500));
System.out.println(c.saldo + " " + c.titular);`, expect:`100.0
true
70.0
false
70.0 Ana`}] },

{ kind:"lesson", id:"encapsulamento", title:"Encapsulamento", eyebrow:"private, getters e setters",
  body:`<p>Deixar os atributos abertos permite que qualquer parte do programa coloque valores absurdos, como idade negativa. O <strong>encapsulamento</strong> resolve: os atributos ficam <code>private</code> (só a própria classe enxerga) e o acesso passa por métodos públicos.</p>
<p>Por convenção, <code>getNome()</code> lê e <code>setNome(valor)</code> altera. O setter pode validar antes de aceitar.</p>`,
  examples:[P(`Termometro t = new Termometro();
t.setCelsius(25);
System.out.println(t.getCelsius());
t.setCelsius(-500);   // impossível: abaixo do zero absoluto
System.out.println(t.getCelsius());`, { before:`class Termometro {
    private double celsius;

    public double getCelsius() {
        return celsius;
    }

    public void setCelsius(double valor) {
        if (valor >= -273.15) {
            celsius = valor;
        }
    }
}` })],
  task:`Complete a classe <code>Pessoa</code>, com atributos <strong>private</strong> <code>nome</code> e <code>idade</code>: crie <code>getNome()</code>, <code>getIdade()</code> e <code>setIdade(int idade)</code>, que só aceita valores de 0 a 130 (fora disso, mantém o valor anterior).`,
  starter:P(`Pessoa p = new Pessoa("Ana", 30);
p.setIdade(-5);
System.out.println(p.getNome() + " " + p.getIdade());`, { before:`class Pessoa {
    private String nome;
    private int idade;

    public Pessoa(String nome, int idade) {
        this.nome = nome;
        this.idade = idade;
    }

}` }),
  hint:`public void setIdade(int idade) { if (idade >= 0 && idade <= 130) this.idade = idade; }`,
  solution:P(`Pessoa p = new Pessoa("Ana", 30);
p.setIdade(-5);
System.out.println(p.getNome() + " " + p.getIdade());`, { before:`class Pessoa {
    private String nome;
    private int idade;

    public Pessoa(String nome, int idade) {
        this.nome = nome;
        this.idade = idade;
    }

    public String getNome() {
        return nome;
    }

    public int getIdade() {
        return idade;
    }

    public void setIdade(int idade) {
        if (idade >= 0 && idade <= 130) {
            this.idade = idade;
        }
    }
}` }),
  require:[{re:/private\s+int\s+idade/, msg:"O atributo idade precisa continuar private."}],
  tests:[{call:`Pessoa p = new Pessoa("Ana", 30);
System.out.println(p.getNome() + " " + p.getIdade());
p.setIdade(31);
System.out.println(p.getIdade());
p.setIdade(-5);
p.setIdade(200);
System.out.println(p.getIdade());`, expect:`Ana 30
31
31`}] },

{ kind:"lesson", id:"tostring", title:"Objetos que se apresentam", eyebrow:"toString",
  body:`<p>Se você mostrar um objeto com <code>println</code>, aparece algo como <code>Produto@1b6d3586</code>. Para escolher o texto, escreva um método <code>public String toString()</code> na classe. A anotação <code>@Override</code> avisa que você está substituindo um método que já existe.</p>`,
  examples:[P(`System.out.println(new Livro("Dom Casmurro", "Machado de Assis"));`, { before:`class Livro {
    String titulo, autor;

    Livro(String titulo, String autor) {
        this.titulo = titulo;
        this.autor = autor;
    }

    @Override
    public String toString() {
        return titulo + ", de " + autor;
    }
}` })],
  task:`Acrescente <code>toString</code> à classe <code>Produto</code> para que <code>System.out.println(new Produto("Caneta", 2.5))</code> mostre <code>Caneta - R$ 2.50</code>.`,
  starter:P(`System.out.println(new Produto("Caneta", 2.5));`, { before:`class Produto {
    String nome;
    double preco;

    Produto(String nome, double preco) {
        this.nome = nome;
        this.preco = preco;
    }

}` }),
  hint:`public String toString() { return nome + " - R$ " + String.format("%.2f", preco); }`,
  solution:P(`System.out.println(new Produto("Caneta", 2.5));`, { before:`class Produto {
    String nome;
    double preco;

    Produto(String nome, double preco) {
        this.nome = nome;
        this.preco = preco;
    }

    @Override
    public String toString() {
        return nome + " - R$ " + String.format("%.2f", preco);
    }
}` }),
  tests:[{call:`System.out.println(new Produto("Caneta", 2.5));
System.out.println(new Produto("Mochila", 120));`, expect:`Caneta - R$ 2.50
Mochila - R$ 120.00`}] },

{ kind:"lesson", id:"heranca", title:"Herança", eyebrow:"extends e super",
  body:`<p>Com <code>class Gerente extends Funcionario</code>, o gerente herda tudo de Funcionario e muda só o que for diferente. O construtor da classe filha chama o da mãe com <code>super(...)</code> na primeira linha.</p>
<p>Para mudar um método herdado, escreva-o de novo na filha, com o mesmo nome e parâmetros (com <code>@Override</code> em cima). Isso é <em>sobrescrever</em>.</p>`,
  examples:[P(`Animal a = new Cachorro("Rex");
System.out.println(a.nome + " diz " + a.falar());`, { before:`class Animal {
    String nome;

    Animal(String nome) {
        this.nome = nome;
    }

    String falar() {
        return "...";
    }
}

class Cachorro extends Animal {
    Cachorro(String nome) {
        super(nome);
    }

    @Override
    String falar() {
        return "Au au";
    }
}` })],
  task:`<code>Funcionario</code> já tem bônus de 10% do salário. Crie <code>Gerente</code>, que herda de <code>Funcionario</code> e tem bônus de 20%.`,
  starter:P(`Gerente g = new Gerente("Leo", 5000);
System.out.println(g.bonus());`, { before:`class Funcionario {
    String nome;
    double salario;

    Funcionario(String nome, double salario) {
        this.nome = nome;
        this.salario = salario;
    }

    double bonus() {
        return salario * 0.1;
    }
}

// crie a classe Gerente aqui
` }),
  hint:`class Gerente extends Funcionario { Gerente(String nome, double salario) { super(nome, salario); } @Override double bonus() { return salario * 0.2; } }`,
  solution:P(`Gerente g = new Gerente("Leo", 5000);
System.out.println(g.bonus());`, { before:`class Funcionario {
    String nome;
    double salario;

    Funcionario(String nome, double salario) {
        this.nome = nome;
        this.salario = salario;
    }

    double bonus() {
        return salario * 0.1;
    }
}

class Gerente extends Funcionario {
    Gerente(String nome, double salario) {
        super(nome, salario);
    }

    @Override
    double bonus() {
        return salario * 0.2;
    }
}` }),
  require:[{re:/class\s+Gerente\s+extends\s+Funcionario/, msg:"Crie a classe com class Gerente extends Funcionario."}],
  tests:[{call:`Funcionario f = new Funcionario("Ana", 3000);
Funcionario g = new Gerente("Leo", 5000);
System.out.println(f.bonus());
System.out.println(g.bonus());
System.out.println(g.nome + " " + g.salario);`, expect:`300.0
1000.0
Leo 5000.0`}] },

{ kind:"lesson", id:"polimorfismo", title:"Polimorfismo", eyebrow:"abstract",
  body:`<p>Uma classe <code>abstract</code> é um molde incompleto: não pode ser criada com <code>new</code>, e seus métodos <code>abstract</code> não têm corpo. Cada classe filha é obrigada a implementá-los.</p>
<p>O bom disso é o <em>polimorfismo</em>: uma variável do tipo da mãe pode guardar qualquer filha, e cada uma responde do seu jeito ao mesmo método.</p>`,

  solution:`import java.util.ArrayList;
import java.util.Scanner;

  solution:`import java.util.ArrayList;

class Conta {
    private String titular;
    private double saldo;
    private ArrayList<String> extrato = new ArrayList<>();

    Conta(String titular) {
        this.titular = titular;
    }

    double getSaldo() {
        return saldo;
    }

    ArrayList<String> getExtrato() {
        return extrato;
    }

    void depositar(double valor) {
        saldo += valor;
        extrato.add(String.format("+ %.2f", valor));
    }

    void sacar(double valor) {
        if (valor > saldo) {
            throw new IllegalArgumentException("Saldo insuficiente");
        }
        saldo -= valor;
        extrato.add(String.format("- %.2f", valor));
    }

    void transferir(Conta destino, double valor) {
        sacar(valor);
        destino.depositar(valor);
    }
}

public class Main {
    public static void main(String[] args) {
        Conta ana = new Conta("Ana");
        Conta leo = new Conta("Leo");
        ana.depositar(100);
        ana.transferir(leo, 30);
        System.out.println(ana.getSaldo() + " " + leo.getSaldo());
        System.out.println(ana.getExtrato());
    }
}

{ kind:"read", id:"proximos", title:"Java fora do navegador", eyebrow:"Próximos passos",
  body:`<p>Tudo o que você aprendeu aqui é Java de verdade e funciona igual no seu computador. Lá você vai criar projetos maiores, com vários arquivos e bibliotecas.</p>
<h2>1. Instale o JDK e um editor</h2>
<p>O JDK é o kit que compila e roda Java. Baixe uma versão LTS (21 ou 25) em <a href="https://adoptium.net/" target="_blank" rel="noopener">adoptium.net</a>. Como editor, o <a href="https://www.jetbrains.com/idea/download/" target="_blank" rel="noopener">IntelliJ IDEA Community</a> é gratuito e o mais usado com Java; o VS Code com o "Extension Pack for Java" também funciona bem.</p>
<h2>2. Compile e rode pelo terminal</h2>
<p>Salve o código num arquivo com o mesmo nome da classe pública, como <code>Main.java</code>. No terminal, <code>javac Main.java</code> compila (gera <code>Main.class</code>) e <code>java Main</code> roda. Para um arquivo só, <code>java Main.java</code> já faz os dois passos.</p>`,
  examples:[`// Desde o Java 25, programas pequenos podem ser escritos sem a classe:
void main() {
    String nome = IO.readln("Seu nome: ");
    IO.println("Olá, " + nome + "!");
}`, `// Gravar e ler arquivos (no seu computador)
import java.nio.file.*;
import java.util.List;

public class Main {
    public static void main(String[] args) throws Exception {
        Files.writeString(Path.of("notas.txt"), "Ana;8\\nLeo;6\\n");
        List<String> linhas = Files.readAllLines(Path.of("notas.txt"));
        for (String l : linhas) {
            String[] p = l.split(";");
            System.out.println(p[0] + " tirou " + p[1]);
        }
    }
}`],
  after:`<h2>3. Projetos maiores: Maven ou Gradle</h2>
<p>Projetos de verdade usam uma ferramenta de build que organiza as pastas e baixa bibliotecas automaticamente. As duas mais usadas são o Maven e o Gradle. O IntelliJ cria um projeto pronto com qualquer uma delas.</p>
<h2>4. Para onde o Java leva</h2>
<p><strong>Back-end e APIs:</strong> o Spring Boot é o framework mais pedido em vagas Java. <strong>Android:</strong> apps Android são feitos em Kotlin, uma linguagem muito parecida, que roda junto com Java. <strong>Bancos e grandes empresas:</strong> boa parte dos sistemas de bancos, seguradoras e governo no Brasil é em Java. <strong>Dados e testes:</strong> JUnit para testes automatizados, JDBC e JPA para bancos de dados.</p>
<h2>5. Onde continuar estudando</h2>
<p>O site oficial <a href="https://dev.java/learn/" target="_blank" rel="noopener">dev.java/learn</a> tem tutoriais gratuitos e atualizados. Assuntos para estudar em seguida: enums, records, generics, a API de Streams e lambdas, e testes com JUnit. E o mais importante: escolha um projeto seu, como um controle de gastos ou um sistema de agendamento, e construa aos poucos.</p>` },

    ["ArrayList", `ArrayList<String> l = new ArrayList<>();
l.add(x)  l.get(i)  l.set(i, x)
l.remove(i)  l.size()  l.contains(x)`],
    ["HashMap", `HashMap<String, Integer> m = new HashMap<>();
m.put(k, v)  m.get(k)  m.getOrDefault(k, 0)
m.containsKey(k)  for (String k : m.keySet())`],
    ["Strings", `s.length()  s.charAt(i)  s.substring(a, b)
s.toUpperCase()  s.trim()  s.split(" ")
s.replace(a, b)  s.contains(t)  s.indexOf(t)
new StringBuilder().append(x).toString()`],
    ["Métodos", `static int soma(int a, int b) {
    return a + b;
}
static void mostrar(String s) { ... }`],
    ["Exceções", `try { ... }
catch (NumberFormatException e) { e.getMessage(); }
finally { ... }
throw new IllegalArgumentException("msg");`],
    ["Classes", `class Conta {
    private double saldo;
    Conta(double s) { saldo = s; }
    double getSaldo() { return saldo; }
    public String toString() { return "..."; }
}
class Poupanca extends Conta { ... super(s); }
interface Pagavel { double valor(); }`],
  ]},
]},
];

if (typeof module !== "undefined") module.exports = { MODULES };

</script>
<script>
const ITEMS = [];
MODULES.forEach((m, mi)=>{ let n = 0; m.items.forEach(it=>{ it.mod = mi; if (it.kind!=="quiz" && it.kind!=="read") it.n = ++n; ITEMS.push(it); }); });
const KIND = { lesson:"Lição", chal:"Desafio", quiz:"Revisão", read:"Leitura" };
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem("cj:"+k); return v===null ? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem("cj:"+k, JSON.stringify(v)); }catch(e){} }
};
let done = new Set(store.get("done", []));
let curId = store.get("cur", "map");
let current = -1;
let attempts = 0;
const codeEl = $("#code"), outEl = $("#out"), fbEl = $("#feedback");
const isMobile = () => window.matchMedia("(max-width:760px)").matches;
let ready = false, running = false;
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hasEditor = it => it && (it.kind==="lesson" || it.kind==="chal");
const icon = it => done.has(it.id) ? "✓" : it.kind==="quiz" ? "?" : it.kind==="read" ? "≡" : it.n;
const modDone = m => m.items.filter(i=>done.has(i.id)).length;
const nextOpen = () => ITEMS.findIndex(i=>!done.has(i.id));

/* ---------- abas (celular) ---------- */
function setView(v){
  $("#main").dataset.view = v;
  $("#tabLesson").setAttribute("aria-selected", v==="lesson");
  $("#tabCode").setAttribute("aria-selected", v==="code");
  if (isMobile()){ syncGutter(); window.scrollTo({top:0}); }
}
$("#tabLesson").onclick = ()=>setView("lesson");
$("#tabCode").onclick = ()=>setView("code");

/* ---------- trilha ---------- */
function renderTrail(){
  const nav = $("#mods"); nav.innerHTML = "";
  const sel = $("#lessonSelect"); sel.innerHTML = "";
  const om = document.createElement("option"); om.value = -1; om.textContent = "▦ Mapa do curso"; om.selected = current===-1; sel.appendChild(om);
  MODULES.forEach((m, mi)=>{
    const d = document.createElement("details");
    const cur = ITEMS[current];
    d.open = cur ? cur.mod===mi : false;
    const c = modDone(m), full = c===m.items.length;
    d.innerHTML = `<summary class="${full?"full":""}"><span class="mnum">${full?"✓":mi+1}</span><span>${esc(m.title)}</span><span class="mcount">${c}/${m.items.length}</span></summary><ol class="items"></ol>`;
    const ol = d.querySelector("ol");
    const og = document.createElement("optgroup"); og.label = `${mi+1}. ${m.title}`;
    m.items.forEach(it=>{
      const i = ITEMS.indexOf(it);
      const li = document.createElement("li");
      li.className = `k-${it.kind}` + (done.has(it.id)?" done":"");
      li.innerHTML = `<button aria-current="${i===current}" title="${KIND[it.kind]}"><span class="ico">${icon(it)}</span><span>${esc(it.title)}</span></button>`;
      li.firstChild.onclick = ()=>openItem(i);
      ol.appendChild(li);
      const o = document.createElement("option"); o.value = i;
      o.textContent = `${done.has(it.id)?"✓ ":""}${it.kind==="lesson"?"":KIND[it.kind]+": "}${it.title}`;
      o.selected = i===current; og.appendChild(o);
    });
    nav.appendChild(d); sel.appendChild(og);
  });
  sel.onchange = ()=>openItem(+sel.value);
  $("#mapBtn").setAttribute("aria-current", current===-1);
  const pct = Math.round(done.size ? ITEMS.filter(i=>done.has(i.id)).length/ITEMS.length*100 : 0);
  $("#progText").textContent = `${pct}% do curso · ${ITEMS.filter(i=>done.has(i.id)).length} de ${ITEMS.length} etapas`;
  $("#progBar").style.width = pct+"%";
}
$("#mapBtn").onclick = ()=>openItem(-1);

/* ---------- navegação ---------- */
function pager(){
  const prev = current>0 ? ITEMS[current-1] : null, next = current<ITEMS.length-1 ? ITEMS[current+1] : null;
  return `<div class="pager">${prev?`<button data-prev>← Anterior<b>${esc(prev.title)}</b></button>`:"<span></span>"}${next?`<button data-nextp>Próximo →<b>${esc(next.title)}</b></button>`:`<button data-map>Voltar ao mapa →<b>Curso completo</b></button>`}</div>`;
}
function bindPager(root){
  const p = root.querySelector("[data-prev]"); if (p) p.onclick = ()=>openItem(current-1);
  const n = root.querySelector("[data-nextp]"); if (n) n.onclick = ()=>openItem(current+1);
  const m = root.querySelector("[data-map]"); if (m) m.onclick = ()=>openItem(-1);
}
function nextBtn(){
  if (current >= ITEMS.length-1) return `<div class="row"><button class="btn" data-next>Ver o mapa do curso →</button></div>`;
  const it = ITEMS[current], nx = ITEMS[current+1];
  const label = nx.mod !== it.mod ? `Próximo módulo: ${MODULES[nx.mod].title} →` : `Seguir: ${nx.title} →`;
  return `<div class="row"><button class="btn" data-next>${esc(label)}</button></div>`;
}
function bindNext(root){ const b = root.querySelector("[data-next]"); if (b) b.onclick = ()=>openItem(current>=ITEMS.length-1 ? -1 : current+1); }
function markDone(it){ done.add(it.id); store.set("done", [...done]); renderTrail(); }

/* ---------- abrir etapas ---------- */
function openItem(i){
  saveCode();
  current = i; attempts = 0;
  curId = i===-1 ? "map" : ITEMS[i].id; store.set("cur", curId);
  const it = ITEMS[i];
  const main = $("#main"), lesson = $("#lesson");
  main.classList.toggle("solo", !hasEditor(it));
  $("#area").classList.toggle("has-editor", hasEditor(it));
  if (i===-1) renderMap();
  else if (it.kind==="quiz") renderQuiz(it);
  else if (it.kind==="read") renderRead(it);
  else renderExercise(it);
  bindPager(lesson);
  renderTrail();
  setView("lesson");
  if (isMobile() || main.classList.contains("solo")) window.scrollTo({top:0});
}

function renderMap(){
  const ni = nextOpen(), total = ITEMS.filter(i=>done.has(i.id)).length;
  const allDone = ni===-1;
  const nx = allDone ? null : ITEMS[ni];
  $("#lesson").innerHTML = `
    <div class="map-head">
      <div class="eyebrow">Mapa do curso</div>
      <h1><span>Seu caminho em Java</span></h1>
      <p>São ${MODULES.length} módulos, do primeiro <code>System.out.println</code> até classes, exceções e projetos completos. Cada módulo tem lições com exercícios corrigidos na hora, desafios para praticar e uma revisão rápida no final. Siga na ordem ou pule para onde quiser.</p>
    </div>
    ${allDone ? `<div class="banner"><b>Curso concluído!</b>Você passou por todas as ${ITEMS.length} etapas. Veja os próximos passos para programar no seu computador.</div>` :
      `<div class="continue"><div><small>${total ? "Continue de onde parou" : "Comece por aqui"}</small><b>${esc(nx.title)}</b><small>Módulo ${nx.mod+1} · ${esc(MODULES[nx.mod].title)}</small></div><button class="btn" id="goNext">${total ? "Continuar" : "Começar"} →</button></div>`}
    <div class="modgrid">${MODULES.map((m,mi)=>{
      const c = modDone(m), pct = Math.round(c/m.items.length*100);
      return `<button class="modcard ${c===m.items.length?"full":""}" data-mod="${mi}"><span class="mn">Módulo ${mi+1}</span><b>${esc(m.title)}</b><span class="s">${esc(m.summary)}</span><span class="row"><span class="bar"><i style="width:${pct}%"></i></span>${c}/${m.items.length}</span></button>`;
    }).join("")}</div>
    <div class="legend"><span><span class="ico">1</span> Lição</span><span class="k-chal"><span class="ico">1</span> Desafio</span><span class="k-quiz"><span class="ico">?</span> Revisão</span><span class="k-read"><span class="ico">≡</span> Leitura</span></div>`;
  const g = $("#goNext"); if (g) g.onclick = ()=>openItem(ni);
  $("#lesson").querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>{
    const m = MODULES[+b.dataset.mod];
    const first = m.items.find(x=>!done.has(x.id)) || m.items[0];
    openItem(ITEMS.indexOf(first));
  });
}

function head(it){
  const m = MODULES[it.mod], pos = m.items.indexOf(it)+1;
  return `<div class="eyebrow ${it.kind==="chal"?"c":""}">Módulo ${it.mod+1} · ${esc(m.title)} · ${KIND[it.kind]}${it.kind==="chal"?" "+esc(it.level):""} (${pos}/${m.items.length})</div>
    <h1><span>${esc(it.title)}</span></h1>`;
}

function renderExercise(it){
  const goCode = `<button class="btn primary go-code" data-go>Ir para o código →</button>`;
  if (it.kind==="lesson"){
    $("#lesson").innerHTML = `${head(it)}
      ${it.body}
      ${it.examples.length ? `<h2>Veja funcionando</h2>` : ""}
      ${it.examples.map((ex,k)=>`<div class="example"><pre>${esc(ex)}</pre><div class="ex-bar"><span>exemplo</span><span><button data-copy="${k}">Copiar para o editor</button><button data-ex="${k}">▶ Rodar</button></span></div></div>`).join("")}
      <div class="task"><strong>Sua vez</strong><p>${it.task}</p></div>${goCode}${pager()}`;
  } else {
    $("#lesson").innerHTML = `${head(it)}
      <div class="task"><strong>O desafio</strong><p>${it.task}</p></div>
      <h2>Para começar</h2>
      <p>${it.tip}</p>${goCode}${pager()}`;
  }
  const L = $("#lesson");
  L.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{ setView("code"); runInteractive(it.examples[+b.dataset.ex]); });
  L.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ codeEl.value = it.examples[+b.dataset.copy]; saveCode(); setView("code"); syncGutter(); });
  L.querySelector("[data-go]").onclick = ()=>setView("code");
  $("#fname").textContent = "Main.java";
  codeEl.value = store.get("code:"+it.id, it.starter);
  syncGutter();
  outEl.innerHTML = `<span class="muted">O resultado do seu código aparece aqui.</span>`;
  fbEl.innerHTML = done.has(it.id) ? `<div class="feedback ok"><b>${it.kind==="lesson"?"Lição concluída.":"Desafio resolvido."}</b> Pode praticar à vontade ou seguir em frente.${nextBtn()}</div>` : "";
  bindNext(fbEl);
}

function renderQuiz(it){
  const state = it.questions.map(()=>({firstTry:null, solved:false}));
  $("#lesson").innerHTML = `${head(it)}
    <p>Responda para conferir se o módulo ficou claro. Errou? Leia a explicação e tente de novo.</p>
    ${it.questions.map((q,qi)=>`<div class="qcard" data-q="${qi}"><div class="qn">Pergunta ${qi+1} de ${it.questions.length}</div><div class="qq">${esc(q.q)}</div>${q.code?`<pre>${esc(q.code)}</pre>`:""}<div class="opts">${q.options.map((o,oi)=>`<button class="opt" data-o="${oi}">${esc(o)}</button>`).join("")}</div><div data-why></div></div>`).join("")}
    <div id="qresult"></div>${pager()}`;
  const L = $("#lesson");
  L.querySelectorAll(".qcard").forEach(card=>{
    const qi = +card.dataset.q, q = it.questions[qi];
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const oi = +b.dataset.o, right = oi===q.answer;
      if (state[qi].firstTry===null) state[qi].firstTry = right;
      if (right){
        state[qi].solved = true;
        b.classList.add("right");
        card.querySelectorAll(".opt").forEach(x=>x.disabled = true);
        card.querySelector("[data-why]").innerHTML = `<div class="why"><b>Isso!</b> ${esc(q.why)}</div>`;
      } else {
        b.classList.add("wrong"); b.disabled = true;
        card.querySelector("[data-why]").innerHTML = `<div class="why"><b>Ainda não.</b> Pense de novo e tente outra opção.</div>`;
      }
      if (state.every(s=>s.solved)){
        const first = state.filter(s=>s.firstTry).length;
        markDone(it);
        const r = $("#qresult");
        r.innerHTML = `<div class="feedback ok"><b>Revisão concluída</b><span class="qsum">Você acertou ${first} de ${it.questions.length} de primeira.</span>${first<it.questions.length?"Vale reler as explicações das que errou antes de seguir.":"Mandou muito bem."}${nextBtn()}</div>`;
        bindNext(r);
      }
    });
  });
  if (done.has(it.id)) $("#qresult").innerHTML = `<div class="feedback ok"><b>Você já concluiu esta revisão.</b> Pode responder de novo para treinar.</div>`;
}

function renderRead(it){
  $("#lesson").innerHTML = `${head(it)}
    ${it.body}
    ${(it.examples||[]).map(ex=>`<div class="example"><pre>${esc(ex)}</pre><div class="ex-bar"><span>para rodar no seu computador</span></div></div>`).join("")}
    ${it.after||""}
    ${it.sheet ? `<div class="sheet">${it.sheet.map(([t,c])=>`<div><b>${esc(t)}</b><pre>${esc(c)}</pre></div>`).join("")}</div>` : ""}
    <div class="read-done" id="readDone"></div>${pager()}`;
  const box = $("#readDone");
  const show = ()=>{ box.innerHTML = done.has(it.id) ? `<div class="feedback ok"><b>Leitura concluída.</b>${nextBtn()}</div>` : `<button class="btn primary">Marcar como lida</button>`;
    const b = box.querySelector(".btn.primary"); if (b) b.onclick = ()=>{ markDone(it); show(); };
    bindNext(box); };
  show();
}

function saveCode(){ const it = ITEMS[current]; if (hasEditor(it)) store.set("code:"+it.id, codeEl.value); }

/* ---------- editor ---------- */
function syncGutter(){
  const n = codeEl.value.split("\n").length;
  $("#gutter").textContent = Array.from({length:n},(_,i)=>i+1).join("\n");
  codeEl.style.height = "auto"; codeEl.style.height = codeEl.scrollHeight+"px";
  const pw = codeEl.parentElement.clientWidth-42;
  codeEl.style.width = "auto"; codeEl.style.width = Math.max(pw, codeEl.scrollWidth)+"px";
}
codeEl.addEventListener("input", ()=>{ syncGutter(); saveCode(); });
function newline(){
  const v = codeEl.value, s = codeEl.selectionStart;
  const lineStart = v.lastIndexOf("\n", s-1)+1, line = v.slice(lineStart, s);
  const ind = line.match(/^ */)[0];
  if (/\{\s*$/.test(line)){
    if (v[codeEl.selectionEnd] === "}"){ insert("\n" + ind + "    " + "\n" + ind, ind.length + 1); return; }
    insert("\n" + ind + "    "); return;
  }
  insert("\n"+ind);
}
function dedent(){
  const v = codeEl.value, s = codeEl.selectionStart;
  const lineStart = v.lastIndexOf("\n", s-1)+1;
  const sp = v.slice(lineStart).match(/^ {1,4}/);
  if (sp){ codeEl.setRangeText("", lineStart, lineStart+sp[0].length, "end"); const p = Math.max(lineStart, s-sp[0].length); codeEl.setSelectionRange(p,p); codeEl.dispatchEvent(new Event("input")); }
}
codeEl.addEventListener("keydown", e=>{
  const v = codeEl.value, s = codeEl.selectionStart, en = codeEl.selectionEnd;
  if ((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); runInteractive(codeEl.value); return; }
  if (e.key==="Tab"){ e.preventDefault(); e.shiftKey ? dedent() : insert("    "); return; }
  if (e.key==="Enter" && !e.isComposing){ e.preventDefault(); newline(); return; }
  if (e.key==="}" && s===en){
    const lineStart = v.lastIndexOf("\n", s-1)+1, before = v.slice(lineStart, s);
    if (/^ {4,}$/.test(before)){ e.preventDefault(); codeEl.setRangeText("}", s-4, s, "end"); codeEl.dispatchEvent(new Event("input")); return; }
  }
  if (e.key==="Backspace" && s===en){
    const lineStart = v.lastIndexOf("\n", s-1)+1, before = v.slice(lineStart, s);
    if (before.length && /^ +$/.test(before)){ e.preventDefault(); const k = (before.length-1)%4+1; codeEl.setRangeText("", s-k, s, "end"); codeEl.dispatchEvent(new Event("input")); }
  }
});
function insert(t, back=0){
  codeEl.setRangeText(t, codeEl.selectionStart, codeEl.selectionEnd, "end");
  if (back){ const p = codeEl.selectionStart-back; codeEl.setSelectionRange(p,p); }
  codeEl.dispatchEvent(new Event("input"));
}
const KEYS = [["⇥","tab","Recuar 4 espaços"],["⇤","dedent","Desfazer recuo"],[";",";"],["{ }","{}",null,1],["( )","()",null,1],["\" \"","\"\"",null,1],["[ ]","[]",null,1],["=","="],["==","=="],["+","+"],["-","-"],["*","*"],["/","/"],["%","%"],["<","<"],[">",">"],["&&"," && "],["||"," || "],["!","!"],[".","."],[",",", "],["println","System.out.println();",null,2],["int","int "],["String","String "],["if","if () {}",null,4],["for","for (int i = 0; i < 10; i++) {}",null,1],["return","return "],["↵","enter","Nova linha"]];
const kb = $("#keys");
KEYS.forEach(([label,val,title,back])=>{
  const b = document.createElement("button"); b.type="button"; b.textContent=label;
  if (label.length>3) b.className="wide";
  b.setAttribute("aria-label", title || ("Inserir "+val.trim()));
  b.addEventListener("pointerdown", e=>e.preventDefault());
  b.addEventListener("click", ()=>{
    if (document.activeElement!==codeEl) codeEl.focus();
    if (val==="tab") insert("    "); else if (val==="dedent") dedent(); else if (val==="enter") newline(); else insert(val, back||0);
  });
  kb.appendChild(b);
});

/* ---------- Java (interpretador MiniJava, roda no próprio navegador) ---------- */
const EXC_HINTS = {
  ArithmeticException: "Houve uma divisão de número inteiro por zero. Confira o valor do divisor antes de dividir.",
  ArrayIndexOutOfBoundsException: "Você pediu uma posição que não existe no array. As posições vão de 0 até length - 1.",
  IndexOutOfBoundsException: "Você pediu uma posição que não existe na lista. As posições vão de 0 até size() - 1.",
  StringIndexOutOfBoundsException: "Você pediu uma posição que não existe no texto. As posições vão de 0 até length() - 1.",
  NullPointerException: "Você usou um valor null (vazio) como se fosse um objeto. Confira se a variável recebeu um objeto (com new) antes de ser usada.",
  NumberFormatException: "Um texto que não é número foi convertido com Integer.parseInt ou Double.parseDouble.",
  InputMismatchException: "O Scanner esperava um número, mas recebeu outra coisa.",
  NoSuchElementException: "O programa pediu mais entradas do que o teste tinha para dar. Confira se o laço termina e se as leituras estão no lugar certo.",
  ClassCastException: "Houve um cast (conversão) entre tipos que não são compatíveis.",
  StackOverflowError: "Um método se chamou vezes demais (recursão sem fim). Confira o caso base.",
  IllegalArgumentException: "Um método recebeu um valor que ele não aceita.",
  ConcurrentModificationException: "A lista foi alterada enquanto era percorrida por um for-each. Use um for com índice ou removeIf.",
};
function describeError(err){
  if (err.kind === "compile") return { text: `Erro de compilação${err.line ? " na linha " + err.line : ""}:\n${err.msg}`, hint: "" , short: `Erro de compilação${err.line ? " na linha " + err.line : ""}: ${err.msg}` };
  if (err.kind === "exception") return { text: err.java + (err.line ? `\n    (na linha ${err.line})` : ""), hint: EXC_HINTS[err.cls] || "O programa lançou uma exceção que não foi tratada com try/catch.", short: err.java };
  if (err.kind === "timeout") return { text: "O programa demorou demais e foi interrompido.", hint: "Talvez um laço nunca termine: confira se a condição do while ou do for um dia fica falsa.", short: "O programa demorou demais (laço infinito?)." };
  return { text: "Erro interno do ambiente: " + err.msg, hint: "Isso parece um limite deste ambiente. Tente escrever o trecho de outro jeito.", short: "Erro interno: " + err.msg };
}
function appendOut(text, cls){
  const span = document.createElement("span"); if (cls) span.className = cls; span.textContent = text;
  outEl.appendChild(span); outEl.scrollTop = outEl.scrollHeight;
}
function setBusy(b){ running=b; ["#run","#check"].forEach(s=>$(s).disabled=b||!ready); }
function showConsole(){ if (isMobile()) $("#console").scrollIntoView({behavior:"smooth", block:"start"}); }
function markErrorLine(line){
  const g = $("#gutter"); if (!g) return;
  const n = codeEl.value.split("\n").length;
  g.innerHTML = Array.from({length:n},(_,i)=> i+1===line ? `<span style="color:var(--err);font-weight:700">${i+1}</span>` : String(i+1)).join("\n");
}
// mostra a saída intercalada com o que a pessoa digitou
function renderTranscript(res, inputs){
  outEl.innerHTML = "";
  const out = res.out; let pos = 0;
  inputs.forEach((line, i) => {
    let at = res.marks[i] !== undefined ? res.marks[i] : out.length;
    if (at < pos) at = pos;
    if (at > pos){ appendOut(out.slice(pos, at)); pos = at; }
    appendOut(line + "\n", "in");
  });
  if (pos < out.length) appendOut(out.slice(pos));
}
function showRunError(err){
  const d = describeError(err);
  if (err.kind === "compile") outEl.innerHTML = "";
  appendOut((outEl.textContent && !outEl.textContent.endsWith("\n") ? "\n" : "") + d.text + "\n", "err");
  if (err.line) markErrorLine(err.line);
  if (d.hint) fbEl.innerHTML = `<div class="feedback bad"><b>O que aconteceu</b><span class="hint">${esc(d.hint)}</span></div>`;
}

let session = 0;
function runInteractive(code){
  if (!ready || running) return;
  fbEl.innerHTML = ""; codeEl.blur(); showConsole(); syncGutter();
  const my = ++session;
  const seed = (Math.random() * 2147483647) | 0;
  const inputs = [];
  setBusy(true);
  const step = () => {
    if (my !== session) return;
    const res = MiniJava.runJava(code, { inputs, seed });
    if (res.error && res.error.kind === "compile"){ showRunError(res.error); setBusy(false); return; }
    renderTranscript(res, inputs);
    if (res.needInput){
      const row = document.createElement("div"); row.className="inrow";
      row.innerHTML = `<input id="stdin" aria-label="Digite a entrada do programa" placeholder="digite e envie" enterkeyhint="send" autocapitalize="off" autocomplete="off" autocorrect="off"><button class="btn" style="padding:4px 12px">Enviar</button><button class="btn ghost" style="padding:4px 8px" title="Parar o programa">Parar</button>`;
      outEl.appendChild(row);
      const [inp] = row.getElementsByTagName("input"), [send, stop] = row.getElementsByTagName("button");
      inp.focus({preventScroll:true}); row.scrollIntoView({block:"nearest"});
      const go = ()=>{ inputs.push(inp.value); setTimeout(step, 0); };
      inp.onkeydown = e=>{ if (e.key==="Enter"){ e.preventDefault(); go(); } };
      send.onclick = go;
      stop.onclick = ()=>{ session++; row.remove(); appendOut("\n(programa interrompido)\n","muted"); setBusy(false); };
      return;
    }
    if (res.error) showRunError(res.error);
    else if (!res.out.trim() && !inputs.length) appendOut("(o programa rodou, mas não mostrou nada. Faltou um System.out.println?)","muted");
    setBusy(false);
  };
  setTimeout(step, 10);
}

const norm = s => s.replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).join("\n").trim();

function checkExercise(){
  if (!ready || running) return;
  const it = ITEMS[current], code = codeEl.value;
  attempts++;
  codeEl.blur(); syncGutter();
  for (const r of (it.require||[])) if (!r.re.test(code)) return showFail(r.msg);
  for (const r of (it.forbid||[])) if (r.re.test(code)) return showFail(r.msg);
  setBusy(true); outEl.innerHTML = ""; session++;
  appendOut("Corrigindo…", "muted");
  setTimeout(()=>{
    outEl.innerHTML = "";
    for (const t of it.tests){
      const res = MiniJava.runJava(code, { inputs: t.inputs || [], noMoreInput: true, testCode: t.call, seed: 20251 });
      if (res.error){
        setBusy(false);
        const d = describeError(res.error);
        if (res.error.kind !== "compile") renderTranscript(res, t.inputs || []);
        appendOut((outEl.textContent && !outEl.textContent.endsWith("\n") ? "\n" : "") + d.text + "\n", "err");
        if (res.error.line) markErrorLine(res.error.line);
        const when = t.inputs && t.inputs.length ? `Testando com a entrada <code>${esc(t.inputs.join(", "))}</code>: ` : "";
        return showFail(`${when}${esc(d.short)}${d.hint ? `<br><span style="color:var(--ink)">${esc(d.hint)}</span>` : ""}`, true);
      }
      if (norm(res.out) !== norm(t.expect)){
        setBusy(false);
        const label = t.inputs && t.inputs.length ? `Testando com a entrada <code>${esc(t.inputs.join(", "))}</code>, ` : (t.call ? `Testando seu código, ` : "");
        renderTranscript(res, t.inputs || []);
        return showFail(`${label}esperava<pre class="solution">${esc(t.expect)}</pre>mas saiu<pre class="solution">${esc(norm(res.out)||"(nada)")}</pre>`, true);
      }
      if (!t.call) renderTranscript(res, t.inputs || []);
    }
    setBusy(false);
    markDone(it);
    const m = MODULES[it.mod], modFull = modDone(m)===m.items.length;
    let title = it.kind==="lesson" ? "Certinho! Exercício concluído." : "Desafio resolvido!";
    let extra = "Passou em todos os testes.";
    if (modFull) extra += ` Você completou o módulo ${it.mod+1}.`;
    if (["jogo","tarefas","banco"].includes(it.id)) extra += " Agora aperte ▶ Executar para usar o programa.";
    fbEl.innerHTML = `<div class="feedback ok"><b>${title}</b>${extra}${nextBtn()}</div>`;
    bindNext(fbEl);
    if (isMobile()) fbEl.scrollIntoView({behavior:"smooth", block:"nearest"});
  }, 30);
}
function showFail(html, raw){
  const it = ITEMS[current];
  fbEl.innerHTML = `<div class="feedback bad"><b>Quase lá</b><span>${raw ? html : esc(html)}</span>
    <div class="row"><button class="btn" data-hint>Ver dica</button>${attempts>=2?`<button class="btn" data-sol>Ver solução</button>`:""}</div><div data-extra></div></div>`;
  fbEl.querySelector("[data-hint]").onclick = ()=> fbEl.querySelector("[data-extra]").innerHTML = `<div class="hint">${esc(it.hint)}</div>`;
  const sb = fbEl.querySelector("[data-sol]");
  if (sb) sb.onclick = ()=>{
    const box = fbEl.querySelector("[data-extra]");
    box.innerHTML = `<pre class="solution">${esc(it.solution)}</pre><div class="row"><button class="btn" data-use>Usar no editor</button></div>`;
    box.querySelector("[data-use]").onclick = ()=>{ codeEl.value = it.solution; syncGutter(); saveCode(); };
  };
  if (isMobile()) fbEl.scrollIntoView({behavior:"smooth", block:"nearest"});
}

$("#run").onclick = ()=>runInteractive(codeEl.value);
$("#check").onclick = checkExercise;
$("#reset").onclick = ()=>{ codeEl.value = ITEMS[current].starter; syncGutter(); saveCode(); fbEl.innerHTML=""; };
$("#clear").onclick = ()=>{ outEl.innerHTML=""; };
window.addEventListener("resize", ()=>{ if (hasEditor(ITEMS[current])) syncGutter(); });

function boot(){
  ready = !!window.MiniJava;
  $("#engine").textContent = ready ? "Java pronto" : "o Java não carregou";
  setBusy(false);
}

const start = ITEMS.findIndex(i=>i.id===curId);
openItem(start);
boot();
</script>

<script>
/* Navegação comum do Código em Jogo:
   - nos jogos: botão "← (lista)" dentro da missão e o "voltar" do celular volta para a lista de missões;
   - nos cursos: o "voltar" do celular volta para o mapa do curso;
   - na lista e no mapa: link "← Código em Jogo" para a plataforma. */
(function(){
  var css = document.createElement("style");
  css.textContent = ".cj-voltar{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:6px 14px 6px 10px;border-radius:99px;border:1.5px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:700;font-size:.86rem;line-height:1.2;cursor:pointer;opacity:.8;min-height:36px}" +
    ".cj-voltar:hover,.cj-voltar:focus-visible{opacity:1}" +
    ".cj-portal{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;font-weight:700;font-size:.88rem;color:inherit;opacity:.75;text-decoration:none}" +
    ".cj-portal:hover,.cj-portal:focus-visible{opacity:1;text-decoration:underline}";
  document.head.appendChild(css);
  var PORTAL = "/";
  function linkPortal(){ var a = document.createElement("a"); a.className = "cj-portal"; a.href = PORTAL; a.textContent = "← Código em Jogo"; return a; }

  /* ---------- jogos ---------- */
  if (typeof openLevel === "function" && typeof showLevels === "function"){
    var btn = document.getElementById("levelsBtn");
    var rotulo = btn ? btn.textContent.trim() : "Missões";
    var abrir = openLevel, lista = showLevels;
    var naMissao = false, voltando = false;
    try { history.replaceState({ cj: "lista" }, ""); } catch (e){}
    var poeBotao = function(){
      var m = document.getElementById("mission");
      if (!m || m.querySelector(".cj-voltar")) return;
      var b = document.createElement("button");
      b.type = "button"; b.className = "cj-voltar"; b.textContent = "← " + rotulo;
      b.setAttribute("aria-label", "Voltar para a lista de " + rotulo.toLowerCase());
      b.onclick = function(){ showLevels(); };
      m.insertBefore(b, m.firstChild);
    };
    var poePortal = function(){
      var v = document.getElementById("view");
      if (v && !v.querySelector(".cj-portal")) v.insertBefore(linkPortal(), v.firstChild);
    };
    var entrou = function(){
      if (!document.getElementById("mission")) return;
      if (!naMissao){ try { history.pushState({ cj: "missao" }, ""); } catch (e){} naMissao = true; }
      poeBotao();
    };
    openLevel = function(){ var r = abrir.apply(this, arguments); entrou(); return r; };
    showLevels = function(){
      var r = lista.apply(this, arguments);
      if (naMissao && !voltando){ naMissao = false; try { history.back(); } catch (e){} }
      naMissao = false;
      poePortal();
      return r;
    };
    window.addEventListener("popstate", function(){
      if (naMissao){ voltando = true; naMissao = false; try { showLevels(); } finally { voltando = false; } }
    });
    if (document.getElementById("mission")) entrou(); else poePortal();
    return;
  }

  /* ---------- cursos ---------- */
  if (typeof openItem === "function"){
    var abrirItem = openItem;
    var noItem = false, voltandoItem = false;
    try { history.replaceState({ cj: "mapa" }, ""); } catch (e){}
    var mapa = function(){
      var l = document.getElementById("lesson");
      if (l && !l.querySelector(".cj-portal")) l.insertBefore(linkPortal(), l.firstChild);
    };
    var depois = function(i){
      if (i === -1){
        if (noItem && !voltandoItem){ noItem = false; try { history.back(); } catch (e){} }
        noItem = false; mapa();
      } else if (!noItem){ try { history.pushState({ cj: "item" }, ""); } catch (e){} noItem = true; }
    };
    openItem = function(i){ var r = abrirItem.apply(this, arguments); depois(i); return r; };
    window.addEventListener("popstate", function(){
      if (noItem){ voltandoItem = true; noItem = false; try { openItem(-1); } finally { voltandoItem = false; } }
    });
    if (typeof current !== "undefined" && current !== -1) depois(current); else mapa();
  }
})();
</script>
