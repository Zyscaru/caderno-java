<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Aprenda Java do zero com lições interativas, exercícios corrigidos na hora, desafios e projetos.">
<meta name="theme-color" content="#1f2d2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno Java">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Caderno de Java</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: caderno quadriculado — trilha por módulos à esquerda; lição + editor/console lado a lado; no celular vira abas Lição / Código */
:root{
  --paper:#f3f7f6; --grid:#dbe6e2; --ink:#1f2d2b; --ink-soft:#4b5f5a; --line:#c5d5d0;
  --card:#ffffff; --code-bg:#1b2826; --code-fg:#e6efec; --code-dim:#86a09a; --key:#283a37;
  --mark:#ffbb55; --mark-ink:#1f2d2b; --accent:#0f766e; --chal:#c2410c;
  --ok:#1f8a4c; --ok-bg:#e3f5ea; --err:#c23a3a; --err-bg:#fbe7e7;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1918; --grid:#162422; --ink:#e4eeeb; --ink-soft:#9db3ae; --line:#26403b;
  --card:#14211f; --code-bg:#0a1211; --code-fg:#e6efec; --code-dim:#7c958f; --key:#1c2d2a;
  --mark:#ffbb55; --mark-ink:#0f1918; --accent:#5eead4; --chal:#fb923c;
  --ok:#5fd394; --ok-bg:#163a2a; --err:#ff8a8a; --err-bg:#45202a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0f1918; --grid:#162422; --ink:#e4eeeb; --ink-soft:#9db3ae; --line:#26403b;
  --card:#14211f; --code-bg:#0a1211; --code-fg:#e6efec; --code-dim:#7c958f; --key:#1c2d2a;
  --mark:#ffbb55; --mark-ink:#0f1918; --accent:#5eead4; --chal:#fb923c;
  --ok:#5fd394; --ok-bg:#163a2a; --err:#ff8a8a; --err-bg:#45202a; color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1380px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}

/* ---------- trilha ---------- */
.trail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 32px);overflow:auto;padding:0 4px 8px 0;scrollbar-width:thin}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.55rem;line-height:1.05;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--ink-soft);letter-spacing:0;margin-top:6px}
.progress{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--ink-soft)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.map-btn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);border-radius:9px;padding:8px 12px;font-weight:700;font-size:.92rem}
.map-btn[aria-current="true"]{background:var(--ink);color:var(--card)}
.mods{display:flex;flex-direction:column;gap:4px}
.mods details{border-radius:10px}
.mods details[open]{background:color-mix(in srgb, var(--card) 70%, transparent)}
.mods summary{list-style:none;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.93rem}
.mods summary::-webkit-details-marker{display:none}
.mods summary:hover{background:var(--card)}
.mods summary .mnum{font-family:var(--f-code);font-size:.78rem;color:var(--ink-soft);text-align:center}
.mods summary .mcount{font-family:var(--f-code);font-size:.72rem;color:var(--ink-soft);font-weight:400;font-variant-numeric:tabular-nums}
.mods summary.full .mcount{color:var(--ok);font-weight:600}
.items{list-style:none;margin:0;padding:0 0 6px 0;display:flex;flex-direction:column;gap:1px}
.items button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;text-align:left;
  background:none;border:0;border-radius:8px;padding:5px 8px 5px 12px;font-size:.88rem;color:var(--ink);line-height:1.3}
.items button:hover{background:var(--card)}
.items button[aria-current="true"]{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-code);font-size:.7rem;
  border:1.5px solid var(--line);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.k-chal .ico{border-radius:5px;border-color:var(--chal);color:var(--chal)}
.k-quiz .ico{border-style:dashed}
.k-read .ico{border-radius:4px}
.done .ico{background:var(--ok);border-color:var(--ok);color:var(--card);border-style:solid}
.k-chal.done .ico{background:var(--chal);border-color:var(--chal)}
.trail-select{display:none}

/* ---------- abas (só celular) ---------- */
.tabs{display:none}

/* ---------- área principal ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start;min-width:0}
.main.solo{grid-template-columns:minmax(0,1fr)}
.main.solo .work{display:none}
.main.solo .lesson{max-width:900px}
.lesson{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:24px 26px;min-width:0}
.eyebrow{font-family:var(--f-code);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.eyebrow.c{color:var(--chal)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.1;letter-spacing:-.025em;margin:6px 0 16px;text-wrap:balance}
h1 span{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .1em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.lesson p{margin:0 0 14px;max-width:64ch}
.lesson code{font-family:var(--f-code);font-size:.88em;background:var(--grid);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:22px 0 10px}
.example{background:var(--code-bg);color:var(--code-fg);border-radius:10px;margin:0 0 16px;overflow:hidden}
.example pre{margin:0;padding:14px 16px;font-family:var(--f-code);font-size:.88rem;line-height:1.55;overflow-x:auto;white-space:pre}
.example .ex-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px 6px 16px;border-top:1px solid #ffffff1a;font-size:.78rem;color:var(--code-dim)}
.example .ex-bar span:last-child{display:flex;gap:6px}
.example button{background:#ffffff14;border:0;border-radius:6px;padding:6px 10px;color:var(--code-fg);font-size:.8rem}
.example button:hover{background:#ffffff26}
.task{background:var(--mark);color:var(--mark-ink);border-radius:10px;padding:14px 16px;margin-top:8px}
.task strong{font-family:var(--f-display);display:block;font-size:1rem;margin-bottom:4px}
.task p{margin:0}
.task code{background:#1d275418}
.go-code{display:none;margin-top:14px;width:100%}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:22px;padding-top:14px;border-top:1px dashed var(--line);flex-wrap:wrap}
.pager button{background:none;border:0;color:var(--ink-soft);font-size:.88rem;padding:6px 0;text-align:left;max-width:48%}
.pager button:last-child{text-align:right;margin-left:auto}
.pager button:hover{color:var(--ink)}
.pager b{display:block;color:var(--ink);font-weight:700}

/* mapa */
.map-head p{max-width:60ch}
.continue{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--card);border-radius:12px;padding:14px 16px;margin:6px 0 22px}
.continue small{display:block;opacity:.75;font-size:.8rem}
.continue b{font-family:var(--f-display);font-size:1.1rem}
.continue .btn{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.modcard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:14px;color:var(--ink)}
.modcard:hover{border-color:var(--ink)}
.modcard .mn{font-family:var(--f-code);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.modcard b{font-family:var(--f-display);font-size:1.1rem;line-height:1.2}
.modcard span.s{font-size:.88rem;color:var(--ink-soft);flex:1}
.modcard .row{display:flex;align-items:center;gap:8px;font-family:var(--f-code);font-size:.75rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.modcard .row .bar{flex:1}
.modcard.full{border-color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;font-size:.82rem;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:6px}
.banner{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.banner b{font-family:var(--f-display);font-size:1.15rem;display:block}

/* quiz */
.qcard{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.qcard .qn{font-family:var(--f-code);font-size:.72rem;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.qcard .qq{font-weight:700;margin:4px 0 10px}
.qcard pre{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font-family:var(--f-code);font-size:.86rem;overflow-x:auto;margin:0 0 10px}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px;font-family:var(--f-code);font-size:.88rem;min-height:42px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--err);background:var(--err-bg);color:var(--err);text-decoration:line-through}
.opt:disabled{cursor:default}
.why{margin-top:10px;font-size:.9rem;padding:8px 10px;border-radius:8px;background:var(--paper)}
.qsum{font-weight:700}

/* leitura */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:8px}
.sheet div{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.sheet b{display:block;padding:6px 10px;font-family:var(--f-display);font-size:.92rem;border-bottom:1px solid var(--line)}
.sheet pre{margin:0;padding:8px 10px;font-family:var(--f-code);font-size:.8rem;line-height:1.5;overflow-x:auto}
.read-done{margin-top:20px}

/* ---------- editor ---------- */
.work{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px;min-width:0}
.editor{background:var(--code-bg);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px -18px #0b0f2a}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid #ffffff14;color:var(--code-dim);font-family:var(--f-code);font-size:.78rem}
.ed-body{display:grid;grid-template-columns:42px 1fr;min-height:250px;max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch}
.gutter{padding:14px 8px 14px 0;text-align:right;font-family:var(--f-code);font-size:.92rem;line-height:1.6;color:#5a638c;user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
#code{background:transparent;color:var(--code-fg);border:0;resize:none;outline:none;padding:14px 14px 14px 10px;font-family:var(--f-code);font-size:.92rem;line-height:1.6;
  white-space:pre;overflow:hidden;tab-size:4;caret-color:var(--mark);min-height:250px;width:100%}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid #ffffff14;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:8px;background:var(--key);color:var(--code-fg);font-family:var(--f-code);font-size:1rem}
.keys button.wide{font-size:.82rem}
.keys button:active{background:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:9px;padding:9px 16px;font-weight:700;font-size:.92rem;min-height:42px}
.btn:hover{background:var(--grid)}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.primary:hover{opacity:.9}
.btn.check{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);font-weight:400}
.btn:disabled{opacity:.5;cursor:wait}
.kbd{font-family:var(--f-code);font-size:.72rem;opacity:.75;margin-left:4px}
.console{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.con-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 14px;border-bottom:1px solid var(--line);font-family:var(--f-code);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
#out{margin:0;padding:12px 14px;min-height:110px;max-height:32vh;overflow:auto;font-family:var(--f-code);font-size:.9rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#out .muted{color:var(--ink-soft)}
#out .err{color:var(--err)}
#out .in{color:var(--accent);font-weight:600}
.inrow{display:flex;gap:6px;margin-top:4px}
.inrow input{flex:1;min-width:0;font-family:var(--f-code);font-size:16px;padding:8px;border:1.5px solid var(--accent);border-radius:6px;background:var(--paper);color:var(--ink)}
.feedback{border-radius:12px;padding:12px 14px;font-size:.93rem;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err);border:1.5px solid var(--err)}
.feedback b{font-family:var(--f-display)}
.feedback code{font-family:var(--f-code)}
.feedback .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.feedback .btn{font-size:.85rem;padding:6px 12px}
.hint{color:var(--ink);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:.9rem;white-space:pre-wrap}
.solution{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font-family:var(--f-code);font-size:.85rem;white-space:pre;overflow-x:auto;margin:0}
.loading{font-size:.82rem;color:var(--ink-soft)}

@media (max-width:1080px){.main{grid-template-columns:minmax(0,1fr)}.work{position:static}}
@media (max-width:760px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
  .wrap{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:14px 32px}
  .trail{position:static;max-height:none;overflow:visible;gap:10px;padding:0}
  .brand{font-size:1.35rem}
  .brand small,.mods{display:none}
  .nav-row{display:grid;grid-template-columns:auto 1fr;gap:8px}
  .trail-select{display:block;width:100%;min-width:0;font:inherit;font-size:16px;padding:9px;border-radius:9px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink)}
  .has-editor .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:6px 0;margin-bottom:6px}
  .tabs button{border:1.5px solid var(--ink);background:var(--card);border-radius:9px;padding:10px;font-weight:700}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
  .main[data-view="lesson"] .work{display:none}
  .main[data-view="code"]:not(.solo) .lesson{display:none}
  .go-code{display:block}
  .lesson{padding:20px 16px}
  .ed-body{max-height:none;min-height:200px}
  #code{font-size:16px;min-height:200px}
  .gutter{font-size:16px}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  .actions .ghost{grid-column:1/-1}
  .kbd{display:none}
  #out{max-height:none}
}
@media (pointer:fine) and (min-width:761px){.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <aside class="trail">
    <div class="brand">Caderno de Java<small>Do primeiro println às suas próprias classes.</small></div>
    <div class="progress"><span id="progText">0% do curso</span><div class="bar"><i id="progBar"></i></div></div>
    <div class="nav-row">
      <button class="map-btn" id="mapBtn">▦ Mapa do curso</button>
      <label for="lessonSelect" hidden>Escolher etapa</label>
      <select class="trail-select" id="lessonSelect"></select>
    </div>
    <nav class="mods" id="mods" aria-label="Módulos do curso"></nav>
  </aside>

  <div id="area">
    <div class="tabs" role="tablist" aria-label="Alternar entre lição e código">
      <button role="tab" id="tabLesson" aria-selected="true">Lição</button>
      <button role="tab" id="tabCode" aria-selected="false">Código</button>
    </div>
    <div class="main" id="main" data-view="lesson">
      <article class="lesson" id="lesson" aria-live="polite"></article>

      <section class="work" aria-label="Área de prática">
        <div class="editor">
          <div class="ed-head"><span id="fname">Main.java</span><span id="engine" class="loading">preparando o Java…</span></div>
          <div class="ed-body"><div class="gutter" id="gutter">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Editor de código"></textarea></div>
          <div class="keys" id="keys" aria-label="Símbolos"></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="run">▶ Executar<span class="kbd">Ctrl+Enter</span></button>
          <button class="btn check" id="check">Corrigir</button>
          <button class="btn ghost" id="reset">Recomeçar código</button>
        </div>
        <div id="feedback"></div>
        <div class="console" id="console">
          <div class="con-head"><span>Saída</span><button class="btn ghost" id="clear" style="min-height:32px;padding:2px 8px;font-size:.75rem">limpar</button></div>
          <pre id="out"><span class="muted">O resultado do seu código aparece aqui.</span></pre>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
/* MiniJava — interpretador de um subconjunto amplo de Java, para ensino no navegador.
   Suporta: classes, herança, interfaces, construtores, static, arrays, String, StringBuilder,
   Scanner (com entrada interativa por replay), Random, Math, ArrayList, HashMap/HashSet (ordem igual à do Java),
   exceções (try/catch/finally/throw), switch clássico e com seta, lambdas simples, printf/String.format
   e arquivos compactos do Java 25 (void main() solto). */
(function (root) {
"use strict";

/* =================================================================== erros */
class CompileError extends Error { constructor(msg, line){ super(msg); this.line = line; } }
class NeedInput extends Error { constructor(outLen){ super("need input"); this.outLen = outLen; } }
class ExitSignal extends Error {}
class TooLong extends Error { constructor(){ super("too long"); } }
class JavaThrow extends Error { constructor(obj, line){ super("java exception"); this.obj = obj; this.line = line; } }
class BreakSig { constructor(label){ this.label = label; } }

  if (e instanceof TooLong) return { kind:"timeout", msg:"o programa demorou demais e foi interrompido. Talvez um laço nunca termine" };
  if (e instanceof RangeError) return { kind:"exception", cls:"StackOverflowError", msg:null, java:`Exception in thread "main" java.lang.StackOverflowError` };
  return { kind:"internal", msg: String(e && e.message || e) };
}
function runJava(src, opts){
  opts = opts || {};
  let it;
  const res = { out:"", error:null, needInput:false, marks:[], it:null };
  try {
    it = new Interp(src, opts);
    res.it = it;
    it.run(opts.testCode ? { testCode: opts.testCode } : null);
  } catch (e){
    if (e instanceof NeedInput){ res.needInput = true; res.needAt = e.outLen; }
    else if (e instanceof ExitSignal){}
    else if (e instanceof ReturnSig){}
    else res.error = friendly(e);
  }
  if (it){ res.out = it.out.join(""); res.marks = it.marks; }
  return res;
}
function check(src){ try { const it = new Interp(src, {}); return null; } catch (e){ return friendly(e); } }

  { q:`O que acontece num switch clássico (com case 1:) quando falta o break?`, options:["Dá erro de compilação","A execução continua no case seguinte","O switch recomeça","Nada de diferente"], answer:1,
    why:`Sem break, o Java segue executando os casos de baixo. Na forma com seta (->) isso não acontece.` },
  { q:`Qual condição é verdadeira para x = 15?`, options:[`x > 10 && x < 12`,`!(x > 10)`,`x < 10 || x == 15`,`x == 10`], answer:2,
    why:`x < 10 é falso, mas x == 15 é verdadeiro, e com || basta uma.` },
  ]},
]},

/* ============================================================ 3 */
{ id:"j3", title:"Repetição", summary:"for, while, do-while, break, continue e laços dentro de laços.",
items:[
{ kind:"lesson", id:"for", title:"Repetindo com for", eyebrow:"Laços",
  body:`<p>O <code>for</code> tem três partes entre parênteses, separadas por <code>;</code>: o início (<code>int i = 1</code>), a condição para continuar (<code>i &lt;= 10</code>) e o passo (<code>i++</code>, que soma 1).</p>
<pre>for (int i = 1; i <= 5; i++) {
    System.out.println(i);
}</pre>`,
  examples:[P(`for (int i = 1; i <= 5; i++) {
    System.out.println(i + " ao quadrado é " + (i * i));
}
for (int i = 10; i > 0; i -= 3) {
    System.out.print(i + " ");
}`)],
  task:`Mostre a tabuada do 7, de <code>7 x 1 = 7</code> até <code>7 x 10 = 70</code>, uma conta por linha.`,
  starter:P(`for (int i = 1; i <= 10; i++) {

}`),
  hint:`Dentro do for: System.out.println("7 x " + i + " = " + (7 * i));`,
  solution:P(`for (int i = 1; i <= 10; i++) {
    System.out.println("7 x " + i + " = " + (7 * i));
}`),
  require:[{re:/\bfor\b/, msg:"Use um for, em vez de escrever as 10 linhas à mão."}],
  tests:[{expect:Array.from({length:10},(_,i)=>`7 x ${i+1} = ${7*(i+1)}`).join("\n")}] },

{ kind:"lesson", id:"acumuladores", title:"Contadores e acumuladores", eyebrow:"Somando dentro do laço",
  body:`<p>Crie uma variável <strong>antes</strong> do laço e atualize <strong>dentro</strong> dele. Um <em>contador</em> soma 1 a cada vez (<code>conta++</code>); um <em>acumulador</em> soma valores (<code>total += valor</code>).</p>`,
  examples:[P(`int total = 0;
for (int i = 1; i <= 5; i++) {
    total += i;
}
System.out.println("Soma de 1 a 5: " + total);`)],
  task:`Use um <code>for</code> com um acumulador para somar todos os números de 1 a 100 e mostre o resultado.`,
  starter:P(`int total = 0;
`),
  hint:`for (int i = 1; i <= 100; i++) { total += i; } e depois System.out.println(total);`,
  solution:P(`int total = 0;
for (int i = 1; i <= 100; i++) {
    total += i;
}
System.out.println(total);`),
  require:[{re:/\bfor\b/, msg:"Use um for."}],
  tests:[{expect:"5050"}] },

{ kind:"lesson", id:"while", title:"Repetindo com while", eyebrow:"Enquanto for verdade",
  body:`<p>O <code>while</code> repete enquanto a condição for verdadeira. É o laço certo quando você não sabe quantas vezes vai repetir. Garanta que algo mude dentro dele, senão o laço nunca termina.</p>
<p>Existe também o <code>do { ... } while (condição);</code>, que roda o bloco pelo menos uma vez antes de testar.</p>`,
  examples:[P(`double saldo = 100;
int meses = 0;
while (saldo < 200) {
    saldo = saldo * 1.1;
    meses++;
}
System.out.println("Dobrou em " + meses + " meses");`)],
  task:`Faça uma contagem regressiva com <code>while</code>: mostre 5, 4, 3, 2, 1 (um por linha) e depois <code>Fogo!</code>`,
  starter:P(`int contador = 5;
`),
  hint:`while (contador > 0) { System.out.println(contador); contador--; } e depois o Fogo!`,
  solution:P(`int contador = 5;
while (contador > 0) {
    System.out.println(contador);
    contador--;
}
System.out.println("Fogo!");`),
  require:[{re:/\bwhile\b/, msg:"Use um while nesta lição."}],
  tests:[{expect:`5
4
3
2
1
Fogo!`}] },

{ kind:"lesson", id:"break", title:"Saindo e pulando", eyebrow:"break e continue",
  body:`<p><code>break</code> sai do laço na hora; <code>continue</code> pula para a próxima repetição. Um padrão comum é <code>while (true)</code> com um <code>break</code> quando chega a hora de parar.</p>`,
  examples:[P(`for (int n = 1; n <= 10; n++) {
    if (n % 2 == 0) {
        continue;   // pula os pares
    }
    System.out.print(n + " ");
}`)],
  task:`Leia números inteiros um por vez e vá somando. Quando a pessoa digitar <code>0</code>, pare e mostre a soma.`,
  starter:P(`Scanner sc = new Scanner(System.in);
int total = 0;
while (true) {
    int numero = sc.nextInt();

}`, { imports: SC }),
  hint:`Dentro do laço: if (numero == 0) break; senão total += numero. Depois do laço, mostre total.`,
  solution:P(`Scanner sc = new Scanner(System.in);
int total = 0;
while (true) {
    int numero = sc.nextInt();
    if (numero == 0) {
        break;
    }
    total += numero;
}
System.out.println(total);`, { imports: SC }),
  require:[{re:/\bbreak\b/, msg:"Use break para sair do laço."}],
  tests:[{inputs:["5","3","2","0"],expect:"10"},{inputs:["0"],expect:"0"},{inputs:["-4","10","0"],expect:"6"}] },

{ kind:"lesson", id:"aninhados", title:"Laços dentro de laços", eyebrow:"Laços aninhados",
  body:`<p>Um laço pode ficar dentro de outro: para cada volta do de fora, o de dentro roda inteiro. <code>System.out.print</code> (sem ln) não pula linha, e um <code>System.out.println()</code> vazio pula.</p>`,
  examples:[P(`for (int linha = 1; linha <= 3; linha++) {
    for (int coluna = 1; coluna <= 4; coluna++) {
        System.out.print("* ");
    }
    System.out.println();
}`)],
  task:`Mostre a tabela de multiplicação de 1 a 3 em formato de grade: três linhas, cada uma com três resultados separados por espaço (<code>1 2 3</code>, depois <code>2 4 6</code>, depois <code>3 6 9</code>).`,
  starter:P(`for (int i = 1; i <= 3; i++) {

}`),
  hint:`Dentro: for (int j = 1; j <= 3; j++) System.out.print(i * j + " "); e depois System.out.println();`,
  solution:P(`for (int i = 1; i <= 3; i++) {
    for (int j = 1; j <= 3; j++) {
        System.out.print(i * j + " ");
    }
    System.out.println();
}`),
  tests:[{expect:`1 2 3
2 4 6
3 6 9`}] },

{ kind:"chal", id:"d-fizz", title:"FizzBuzz", level:"Médio",
  task:`Mostre os números de 1 a 15, um por linha. Mas: múltiplos de 3 viram <code>Fizz</code>, múltiplos de 5 viram <code>Buzz</code> e múltiplos dos dois viram <code>FizzBuzz</code>.`,
  tip:`Teste primeiro o caso dos dois (múltiplo de 15), senão ele nunca é alcançado.`,
  starter:P(`for (int n = 1; n <= 15; n++) {

}`),
  hint:`if (n % 15 == 0) ... else if (n % 3 == 0) ... else if (n % 5 == 0) ... else System.out.println(n);`,

        System.out.println(n);
    }
}`),

2

4
Buzz
Fizz
7
8
Fizz
Buzz
11
Fizz
13
14
FizzBuzz`}] },

{ kind:"chal", id:"d-primo", title:"Número primo", level:"Difícil",
  task:`Leia um número inteiro e mostre <code>Primo</code> ou <code>Não é primo</code>. Primo é o número maior que 1 divisível só por 1 e por ele mesmo.`,
  tip:`Teste os divisores de 2 até n - 1. Uma variável <code>boolean primo</code> ajuda a lembrar o que você descobriu.`,
  starter:P(`Scanner sc = new Scanner(System.in);
int n = sc.nextInt();
`, { imports: SC }),
  hint:`boolean primo = n > 1; for (int d = 2; d < n; d++) if (n % d == 0) { primo = false; break; }`,
  solution:P(`Scanner sc = new Scanner(System.in);
int n = sc.nextInt();
boolean primo = n > 1;
for (int d = 2; d < n; d++) {
    if (n % d == 0) {
        primo = false;
        break;
    }
}
if (primo) {
    System.out.println("Primo");
} else {
    System.out.println("Não é primo");
}`, { imports: SC }),
  tests:[{inputs:["7"],expect:"Primo"},{inputs:["9"],expect:"Não é primo"},{inputs:["2"],expect:"Primo"},{inputs:["1"],expect:"Não é primo"},{inputs:["97"],expect:"Primo"}] },

{ kind:"quiz", id:"q3", title:"Revisão: repetição",
  questions:[
  { q:`Quantas vezes este laço repete?`, code:`for (int i = 0; i < 3; i++) {

}`, options:["2","3","4","Infinitas"], answer:1,

  { q:`O que o continue faz?`, options:["Sai do laço","Pula para a próxima repetição","Encerra o programa","Repete a mesma volta"], answer:1,

{ id:"j4", title:"Arrays e coleções", summary:"Arrays, ArrayList e HashMap: guardar e organizar muitos valores.",
items:[
{ kind:"lesson", id:"arrays", title:"Arrays", eyebrow:"Vários valores do mesmo tipo",
  body:`<p>Um <em>array</em> guarda vários valores do mesmo tipo, com tamanho fixo. As posições começam do <strong>zero</strong>, e <code>numeros.length</code> (sem parênteses) diz quantos itens ele tem; por isso o último é <code>numeros[numeros.length - 1]</code>.</p>
<pre>int[] notas = {7, 5, 9};
double[] precos = new double[10];   // 10 posições, todas 0.0</pre>`,
  examples:[P(`String[] cores = {"azul", "verde", "roxo"};
System.out.println(cores[0]);
cores[1] = "laranja";
System.out.println(cores[1]);
System.out.println(cores.length + " cores");
int[] vazio = new int[3];
System.out.println(vazio[2]);`)],
  task:`Com o array de notas, mostre em linhas separadas: a primeira nota, a última nota (use <code>length</code>, não escreva a posição direto) e quantas notas existem.`,
  starter:P(`int[] notas = {7, 5, 9, 6, 10};
`),
  hint:`notas[0], notas[notas.length - 1] e notas.length`,
  solution:P(`int[] notas = {7, 5, 9, 6, 10};
System.out.println(notas[0]);
System.out.println(notas[notas.length - 1]);
System.out.println(notas.length);`),
  require:[{re:/length\s*-\s*1/, msg:"Para a última nota, use notas[notas.length - 1]."}],
  tests:[{expect:`7
10
5`}] },

{ kind:"lesson", id:"percorrer", title:"Percorrendo arrays", eyebrow:"for e for-each",
  body:`<p>Para passar por todos os itens, use um <code>for</code> com índice ou o <em>for-each</em>, mais curto, quando você só precisa dos valores:</p>
<pre>for (double p : precos) {
    // p vale cada preço, um de cada vez
}</pre>
<p>Para mostrar um array inteiro de uma vez, use <code>Arrays.toString(array)</code> (com <code>import java.util.Arrays;</code>). Um <code>println</code> direto no array mostra só um código estranho.</p>`,
  examples:[P(`int[] temperaturas = {28, 31, 25, 33};
int quentes = 0;
for (int t : temperaturas) {
    if (t > 30) {
        quentes++;
    }
}
System.out.println(quentes + " dias quentes");
System.out.println(Arrays.toString(temperaturas));
for (int i = 0; i < temperaturas.length; i++) {
    System.out.println("Dia " + (i + 1) + ": " + temperaturas[i]);
}`, { imports:"import java.util.Arrays;" })],
  task:`Percorra o array de preços. Mostre quantos produtos custam mais de 10 reais e, na linha seguinte, a soma de todos os preços.`,
  starter:P(`double[] precos = {12.5, 8, 30, 4.5};
int caros = 0;
double total = 0;
`),
  hint:`for (double p : precos) { total += p; if (p > 10) caros++; }`,
  solution:P(`double[] precos = {12.5, 8, 30, 4.5};
int caros = 0;
double total = 0;
for (double p : precos) {
    total += p;
    if (p > 10) {
        caros++;
    }
}
System.out.println(caros);
System.out.println(total);`),
  require:[{re:/\bfor\b/, msg:"Use um for para percorrer o array."}],
  tests:[{expect:`2
55.0`}] },

{ kind:"lesson", id:"arrays2", title:"Ordenando e copiando", eyebrow:"A classe Arrays",
  body:`<p>A classe <code>Arrays</code> tem ferramentas prontas: <code>Arrays.sort(a)</code> ordena o próprio array, <code>Arrays.toString(a)</code> transforma em texto e <code>Arrays.copyOf(a, n)</code> cria uma cópia com os <code>n</code> primeiros itens.</p>`,
  examples:[P(`int[] numeros = {4, 1, 9, 7};
Arrays.sort(numeros);
System.out.println(Arrays.toString(numeros));
int[] doisPrimeiros = Arrays.copyOf(numeros, 2);
System.out.println(Arrays.toString(doisPrimeiros));`, { imports:"import java.util.Arrays;" })],
  task:`Ordene o array de notas e mostre-o com <code>Arrays.toString</code>. Na linha seguinte, mostre um array só com as três menores notas.`,
  starter:P(`int[] notas = {7, 5, 9, 6, 10};
`, { imports:"import java.util.Arrays;" }),
  hint:`Arrays.sort(notas); depois Arrays.toString(notas) e Arrays.toString(Arrays.copyOf(notas, 3))`,
  solution:P(`int[] notas = {7, 5, 9, 6, 10};
Arrays.sort(notas);
System.out.println(Arrays.toString(notas));
System.out.println(Arrays.toString(Arrays.copyOf(notas, 3)));`, { imports:"import java.util.Arrays;" }),
  tests:[{expect:`[5, 6, 7, 9, 10]
[5, 6, 7]`}] },

{ kind:"lesson", id:"arraylist", title:"ArrayList", eyebrow:"Listas que crescem",
  body:`<p>Arrays têm tamanho fixo. Quando a quantidade muda, use uma <code>ArrayList</code>, que cresce e encolhe:</p>
<pre>ArrayList&lt;String&gt; nomes = new ArrayList&lt;&gt;();</pre>
<p>O tipo dos itens vai entre <code>&lt; &gt;</code>. Para números, use <code>Integer</code> e <code>Double</code> (com maiúscula), não <code>int</code>. Métodos: <code>add</code>, <code>get(i)</code>, <code>set(i, v)</code>, <code>remove</code>, <code>size()</code> e <code>contains</code>.</p>`,
  examples:[P(`ArrayList<String> cores = new ArrayList<>();
cores.add("azul");
cores.add("verde");
cores.add("roxo");
System.out.println(cores);
cores.remove("verde");
System.out.println(cores.get(0) + ", " + cores.size() + " itens");
System.out.println(cores.contains("roxo"));`, { imports:"import java.util.ArrayList;" })],
  task:`Adicione <code>"frutas"</code> à lista de compras. Depois mostre, em linhas separadas, quantos itens a lista tem e qual é o último item.`,
  starter:P(`ArrayList<String> compras = new ArrayList<>();
compras.add("arroz");
compras.add("leite");
compras.add("ovos");
`, { imports:"import java.util.ArrayList;" }),
  hint:`compras.add("frutas"); depois compras.size() e compras.get(compras.size() - 1)`,
  solution:P(`ArrayList<String> compras = new ArrayList<>();
compras.add("arroz");
compras.add("leite");
compras.add("ovos");
compras.add("frutas");
System.out.println(compras.size());
System.out.println(compras.get(compras.size() - 1));`, { imports:"import java.util.ArrayList;" }),
  tests:[{expect:`4
frutas`}] },

{ kind:"lesson", id:"hashmap", title:"HashMap", eyebrow:"Pares de chave e valor",
  body:`<p>Um <code>HashMap</code> guarda valores por <strong>chave</strong>, como uma agenda: você procura pelo nome e encontra o telefone. Declare os dois tipos: <code>HashMap&lt;String, Integer&gt;</code>.</p>
<p><code>put(chave, valor)</code> guarda ou substitui, <code>get(chave)</code> busca (devolve <code>null</code> se não existir), <code>getOrDefault(chave, padrão)</code> busca com um valor reserva e <code>size()</code> conta os pares.</p>`,
  examples:[P(`HashMap<String, String> agenda = new HashMap<>();
agenda.put("Ana", "9999-1111");
agenda.put("Leo", "9888-2222");
System.out.println(agenda.get("Ana"));
System.out.println(agenda.get("Bia"));
System.out.println(agenda.getOrDefault("Bia", "sem telefone"));
System.out.println(agenda.size() + " contatos");`, { imports:"import java.util.HashMap;" })],
  task:`No estoque: mude a quantidade de <code>"caneta"</code> para 8 e adicione <code>"lapis"</code> com 20. Depois mostre, um por linha: a quantidade de caneta, a de lapis e quantos itens o estoque tem.`,
  starter:P(`HashMap<String, Integer> estoque = new HashMap<>();
estoque.put("caneta", 10);
estoque.put("caderno", 5);
`, { imports:"import java.util.HashMap;" }),
  hint:`estoque.put("caneta", 8); estoque.put("lapis", 20); depois get e size().`,
  solution:P(`HashMap<String, Integer> estoque = new HashMap<>();
estoque.put("caneta", 10);
estoque.put("caderno", 5);
estoque.put("caneta", 8);
estoque.put("lapis", 20);
System.out.println(estoque.get("caneta"));
System.out.println(estoque.get("lapis"));
System.out.println(estoque.size());`, { imports:"import java.util.HashMap;" }),
  tests:[{expect:`8
20
3`}] },

{ kind:"lesson", id:"hashmap2", title:"Percorrendo um HashMap", eyebrow:"keySet e containsKey",
  body:`<p>Para passar por todas as chaves, use <code>for (String chave : mapa.keySet())</code>. <code>containsKey(chave)</code> diz se a chave existe.</p>
<p>A ordem em que um <code>HashMap</code> mostra os itens não é a ordem em que foram colocados. Se a ordem importar, use <code>LinkedHashMap</code> (ordem de inserção) ou <code>TreeMap</code> (ordem alfabética).</p>`,

for (String produto : precos.keySet()) {

}

  task:`Calcule o total do carrinho usando o mapa de preços: percorra o carrinho, some o preço de cada item e mostre o total.`,

double total = 0;
`, { imports:"import java.util.HashMap;" }),
  hint:`for (String item : carrinho) { total += precos.get(item); }`,
  solution:P(`HashMap<String, Double> precos = new HashMap<>();
precos.put("pao", 1.5);
precos.put("leite", 4.0);
precos.put("cafe", 12.0);
String[] carrinho = {"pao", "pao", "leite", "cafe"};
double total = 0;
for (String item : carrinho) {

}
System.out.println(total);`, { imports:"import java.util.HashMap;" }),

{ kind:"chal", id:"d-acima", title:"Notas acima da média", level:"Médio",
  task:`Calcule a média das notas e mostre-a. Na linha seguinte, mostre uma <code>ArrayList</code> com as notas que ficaram acima da média.`,
  tip:`Some tudo, divida por <code>notas.length</code> (com cuidado para ser divisão com decimais) e depois percorra de novo adicionando as notas maiores que a média.`,
  starter:P(`int[] notas = {6, 8, 5, 9, 7};
`, { imports:"import java.util.ArrayList;" }),
  hint:`double media = (double) soma / notas.length; ArrayList<Integer> acima = new ArrayList<>(); ...`,
  solution:P(`int[] notas = {6, 8, 5, 9, 7};
int soma = 0;
for (int n : notas) {
    soma += n;
}
double media = (double) soma / notas.length;
ArrayList<Integer> acima = new ArrayList<>();
for (int n : notas) {
    if (n > media) {
        acima.add(n);
    }
}
System.out.println(media);
System.out.println(acima);`, { imports:"import java.util.ArrayList;" }),
  tests:[{expect:`7.0
[8, 9]`}] },

/* ============================================================ 5 */
{ id:"j5", title:"Métodos", summary:"Criar seus próprios métodos, com parâmetros, retorno, sobrecarga e recursão.",
items:[
{ kind:"lesson", id:"metodos", title:"Criando métodos", eyebrow:"static e return",
  body:`<p>Um <em>método</em> é um bloco de código com nome que você pode chamar várias vezes. Por enquanto, crie seus métodos dentro da classe <code>Main</code>, fora do <code>main</code>, com <code>static</code>:</p>
<pre>static int dobro(int n) {
    return n * 2;
}</pre>
<p>Antes do nome vem o tipo do que ele devolve (<code>int</code>, <code>String</code>…, ou <code>void</code> se não devolve nada). Entre parênteses, os parâmetros, cada um com seu tipo.</p>`,
  examples:[P(`System.out.println(saudacao("Bia"));
String m = saudacao("Leo");
System.out.println(m.toUpperCase());`, { methods:`static String saudacao(String nome) {
    return "Bom dia, " + nome + "!";
}` })],
  task:`Crie o método <code>static int dobro(int n)</code> que <strong>devolve</strong> o dobro do número. O corretor vai chamar o método com vários números.`,
  starter:P(`System.out.println(dobro(5));`, { methods:`// crie o método dobro aqui
` }),
  hint:`static int dobro(int n) { return n * 2; }`,
  solution:P(`System.out.println(dobro(5));`, { methods:`static int dobro(int n) {
    return n * 2;
}` }),
  tests:[{call:`System.out.println(dobro(4));
System.out.println(dobro(-3));
System.out.println(dobro(0));`, expect:`8
-6
0`}] },

{ kind:"lesson", id:"parametros", title:"Parâmetros e sobrecarga", eyebrow:"Mesmo nome, parâmetros diferentes",
  body:`<p>Um método pode receber vários parâmetros, separados por vírgula. E podem existir vários métodos com o <strong>mesmo nome</strong>, desde que recebam parâmetros diferentes: isso é a <em>sobrecarga</em>. O Java escolhe qual usar pelo que você passa.</p>`,
  examples:[P(`System.out.println(area(3));
System.out.println(area(3, 4));`, { methods:`static int area(int lado) {
    return lado * lado;
}

static int area(int largura, int altura) {
    return largura * altura;
}` })],
  task:`Crie duas versões de <code>saudacao</code>: <code>saudacao(String nome)</code> devolve <code>Olá, Ana!</code> e <code>saudacao(String nome, String cumprimento)</code> devolve, por exemplo, <code>Bom dia, Leo!</code>.`,
  starter:P(`System.out.println(saudacao("Ana"));
System.out.println(saudacao("Leo", "Bom dia"));`, { methods:`` }),
  hint:`A versão de um parâmetro pode chamar a outra: return saudacao(nome, "Olá");`,
  solution:P(`System.out.println(saudacao("Ana"));
System.out.println(saudacao("Leo", "Bom dia"));`, { methods:`static String saudacao(String nome, String cumprimento) {
    return cumprimento + ", " + nome + "!";
}

static String saudacao(String nome) {
    return saudacao(nome, "Olá");
}` }),
  tests:[{call:`System.out.println(saudacao("Ana"));
System.out.println(saudacao("Leo", "Bom dia"));
System.out.println(saudacao("Bia", "Oi"));`, expect:`Olá, Ana!
Bom dia, Leo!
Oi, Bia!`}] },

{ kind:"lesson", id:"escopo", title:"Variáveis dentro de métodos", eyebrow:"Escopo",
  body:`<p>Variáveis declaradas dentro de um método (ou dentro de um bloco <code>{ }</code>) só existem ali dentro. Quando o método termina, elas somem.</p>
<p>Além disso, o Java passa números para os métodos como <strong>cópia</strong>: mudar o parâmetro lá dentro não muda a variável de quem chamou. Por isso o jeito certo é devolver o novo valor com <code>return</code> e guardar o resultado.</p>`,
  examples:[P(`int pontos = 10;
tentaMudar(pontos);
System.out.println(pontos);   // continua 10`, { methods:`static void tentaMudar(int pontos) {
    pontos = 99;   // muda só a cópia
}` })],
  task:`Crie <code>static int adicionarPonto(int pontos)</code> que devolve a pontuação com 1 a mais. O corretor vai começar com 0 pontos e chamar o método duas vezes, guardando o resultado.`,
  starter:P(`int p = 0;
p = adicionarPonto(p);
System.out.println(p);`, { methods:`` }),
  hint:`static int adicionarPonto(int pontos) { return pontos + 1; }`,
  solution:P(`int p = 0;
p = adicionarPonto(p);
System.out.println(p);`, { methods:`static int adicionarPonto(int pontos) {
    return pontos + 1;
}` }),
  tests:[{call:`int p = 0;
p = adicionarPonto(p);
p = adicionarPonto(p);
System.out.println(p);
System.out.println(adicionarPonto(10));`, expect:`2
11`}] },

{ kind:"lesson", id:"recursao", title:"Recursão", eyebrow:"Um método que chama a si mesmo",
  body:`<p>Um método <em>recursivo</em> resolve um problema chamando a si mesmo com um pedaço menor. Ele precisa de um <strong>caso base</strong>, que responde direto e faz a recursão parar.</p>
<p>O fatorial cresce rápido: 20! já passa do limite do <code>int</code> (cerca de 2 bilhões). Para números grandes, use <code>long</code>, que vai até cerca de 9 quintilhões.</p>`,
  examples:[P(`contagem(3);`, { methods:`static void contagem(int n) {
    if (n == 0) {
        System.out.println("Fim!");
        return;
    }
    System.out.println(n);
    contagem(n - 1);
}` })],
  task:`Crie <code>static long fatorial(int n)</code> de forma recursiva: se <code>n</code> for 0 ou 1, devolve 1; senão, devolve <code>n</code> vezes o fatorial de <code>n - 1</code>.`,
  starter:P(`System.out.println(fatorial(5));`, { methods:`` }),
  hint:`if (n <= 1) return 1; return n * fatorial(n - 1);`,
  solution:P(`System.out.println(fatorial(5));`, { methods:`static long fatorial(int n) {
    if (n <= 1) {
        return 1;
    }
    return n * fatorial(n - 1);
}` }),
  require:[{re:/fatorial\s*\(\s*n\s*-\s*1\s*\)/, msg:"O método precisa chamar fatorial(n - 1) dentro dele."}],
  tests:[{call:`System.out.println(fatorial(5));
System.out.println(fatorial(0));
System.out.println(fatorial(20));`, expect:`120
1
2432902008176640000`}] },

{ kind:"lesson", id:"boletim", title:"Projeto: boletim", eyebrow:"Juntando tudo",
  body:`<p>Hora de juntar arrays, métodos e decisões. Um método pode receber um array inteiro como parâmetro, e um método pode chamar outro.</p>`,
  examples:[P(`int[] v = {10, 25, 5};
System.out.println(soma(v));`, { methods:`static int soma(int[] numeros) {
    int total = 0;
    for (int n : numeros) {
        total += n;
    }
    return total;
}` })],
  task:`Crie <code>static double media(double[] notas)</code>, que devolve a média, e <code>static String situacao(double[] notas)</code>, que devolve <code>"Aprovado"</code> se a média for 7 ou mais, senão <code>"Reprovado"</code>.`,
  starter:P(`double[] notas = {7, 8, 9};
System.out.println(media(notas) + " " + situacao(notas));`, { methods:`` }),
  hint:`Na média, some num for e divida por notas.length. Em situacao, chame media(notas) dentro de um if.`,
  solution:P(`double[] notas = {7, 8, 9};
System.out.println(media(notas) + " " + situacao(notas));`, { methods:`static double media(double[] notas) {
    double soma = 0;
    for (double n : notas) {
        soma += n;
    }
    return soma / notas.length;
}

static String situacao(double[] notas) {
    if (media(notas) >= 7) {
        return "Aprovado";
    }
    return "Reprovado";
}` }),
  tests:[{call:`System.out.println(media(new double[]{7, 8, 9}));
System.out.println(media(new double[]{10, 5}));
System.out.println(situacao(new double[]{7, 8, 9}));
System.out.println(situacao(new double[]{4, 6, 5}));
System.out.println(situacao(new double[]{7, 7}));`, expect:`8.0
7.5
Aprovado
Reprovado
Aprovado`}] },

{ kind:"chal", id:"d-maior", title:"O maior de três (método)", level:"Fácil",
  task:`Crie <code>static int maior(int a, int b, int c)</code> que devolve o maior dos três, <strong>sem usar</strong> <code>Math.max</code>.`,
  tip:`Guarde o primeiro como maior e compare com os outros dois.`,
  starter:P(`System.out.println(maior(1, 2, 3));`, { methods:`` }),
  hint:`int m = a; if (b > m) m = b; if (c > m) m = c; return m;`,
  solution:P(`System.out.println(maior(1, 2, 3));`, { methods:`static int maior(int a, int b, int c) {
    int m = a;
    if (b > m) {
        m = b;
    }
    if (c > m) {
        m = c;
    }
    return m;
}` }),
  forbid:[{re:/Math\.max/, msg:"Tente sem Math.max: é esse o desafio."}],
  tests:[{call:`System.out.println(maior(1, 2, 3));
System.out.println(maior(9, 4, 7));
System.out.println(maior(5, 8, 2));
System.out.println(maior(-1, -5, -3));`, expect:`3
9
8
-1`}] },

{ kind:"chal", id:"d-soma", title:"Maior e menor do array", level:"Médio",
  task:`Crie <code>static int maiorDoArray(int[] v)</code> e <code>static int menorDoArray(int[] v)</code>, sem usar ordenação nem <code>Math</code>.`,
  tip:`Comece considerando o primeiro item como o maior (ou menor) e percorra o resto.`,
  starter:P(`int[] v = {4, 9, 1, 7};
System.out.println(maiorDoArray(v) + " " + menorDoArray(v));`, { methods:`` }),
  hint:`int m = v[0]; for (int x : v) if (x > m) m = x; return m;`,
  solution:P(`int[] v = {4, 9, 1, 7};
System.out.println(maiorDoArray(v) + " " + menorDoArray(v));`, { methods:`static int maiorDoArray(int[] v) {
    int m = v[0];
    for (int x : v) {
        if (x > m) {
            m = x;
        }
    }
    return m;
}

static int menorDoArray(int[] v) {
    int m = v[0];
    for (int x : v) {
        if (x < m) {
            m = x;
        }
    }
    return m;
}` }),
  forbid:[{re:/Arrays\.sort|Math\./, msg:"Resolva percorrendo o array, sem Arrays.sort e sem Math."}],
  tests:[{call:`System.out.println(maiorDoArray(new int[]{4, 9, 1, 7}));
System.out.println(menorDoArray(new int[]{4, 9, 1, 7}));
System.out.println(maiorDoArray(new int[]{-5, -2, -9}));
System.out.println(menorDoArray(new int[]{3}));`, expect:`9
1
-2
3`}] },

{ kind:"chal", id:"d-vogais", title:"Contando vogais", level:"Médio",
  task:`Crie <code>static int contarVogais(String texto)</code> que devolve quantas vogais (a, e, i, o, u) o texto tem, valendo também para maiúsculas.`,
  tip:`Percorra com <code>texto.charAt(i)</code>. Deixar o texto em minúsculas antes simplifica, e <code>"aeiou".indexOf(c) &gt;= 0</code> diz se o caractere é vogal.`,
  starter:P(`System.out.println(contarVogais("Banana"));`, { methods:`` }),
  hint:`String t = texto.toLowerCase(); for (int i = 0; i < t.length(); i++) if ("aeiou".indexOf(t.charAt(i)) >= 0) conta++;`,
  solution:P(`System.out.println(contarVogais("Banana"));`, { methods:`static int contarVogais(String texto) {
    String t = texto.toLowerCase();
    int conta = 0;
    for (int i = 0; i < t.length(); i++) {
        if ("aeiou".indexOf(t.charAt(i)) >= 0) {
            conta++;
        }
    }
    return conta;
}` }),
  tests:[{call:`System.out.println(contarVogais("banana"));
System.out.println(contarVogais("Java"));
System.out.println(contarVogais("AEIOU"));
System.out.println(contarVogais("xyz"));`, expect:`3
2
5
0`}] },

{ kind:"quiz", id:"q5", title:"Revisão: métodos",
  questions:[
  { q:`O que significa void antes do nome de um método?`, options:["Que ele é vazio","Que ele não devolve nenhum valor","Que ele não recebe parâmetros","Que ele é privado"], answer:1,
    why:`void indica que o método só executa ações, sem return de valor.` },
  { q:`Por que o main só consegue chamar direto os métodos static?`, options:["Porque o main é static e não tem um objeto para usar","Porque static é mais rápido","Porque métodos sem static são privados","Não consegue chamar nenhum"], answer:0,
    why:`Métodos sem static pertencem a um objeto. No main não há objeto, a não ser que você crie um com new.` },
  { q:`Dois métodos com o mesmo nome e parâmetros diferentes na mesma classe…`, options:["Dão erro de compilação","São permitidos: é a sobrecarga","Só se um for void","Só se forem private"], answer:1,
    why:`O Java escolhe qual chamar pela quantidade e pelo tipo dos valores passados.` },
  { q:`Qual tipo usar para guardar 20! (2432902008176640000)?`, options:["int","long","double","char"], answer:1,
    why:`O int vai só até cerca de 2,1 bilhões. O long aguenta até cerca de 9,2 quintilhões.` },
  ]},
]},
